<script>
(function(){
var OPTS=[
{v:"inperson",short:"In person",long:"In person"},
{v:"remote",short:"Fully remote",long:"Fully remote: no on-site work required"},
{v:"hybrid",short:"Hybrid",long:"Hybrid: some on-site work required"},
{v:"road",short:"On the road",long:"On the road"}];
var cur="inperson";
var TPL=[{n:"Registered Nurse",m:"Dallas, TX \u00b7 July 28th, 2026"},{n:"Certified Nursing Assistant",m:"Pittsburgh, PA \u00b7 July 25th, 2026"},{n:"Warehouse Associate",m:"Austin, TX \u00b7 July 23rd, 2026"},{n:"RN Care Manager",m:"Houston, TX \u00b7 July 16th, 2026"}];
var sel=document.getElementById("locSel"),menu=document.getElementById("locMenu"),lab=document.getElementById("locLabel"),cond=document.getElementById("locCond");
function fld(id,label,helper){var h="<label class=fld for="+id+">"+label+" <span class=req>*</span></label>";if(helper)h+="<div class=helper>"+helper+"</div>";h+="<input type=text id="+id+">";return h}
function radios(name,q,opts,def){var h="<span class=q>"+q+"</span>";opts.forEach(function(o){h+="<label class=radio-row><input type=radio name="+name+" value="+o.v+(o.v===def?" checked":"")+"><span class=radio-label>"+o.t+"</span></label>"});return h}
function renderCond(){
if(cur==="inperson"){cond.innerHTML=fld("locInput","What is the job location?","Enter a street address or ZIP code")}
else if(cur==="hybrid"){cond.innerHTML=fld("locInput","Street address","")}
else if(cur==="remote"){cond.innerHTML=radios("reside","Are employees required to reside in a specific location?",[{v:"yes",t:"Yes"},{v:"no",t:"No"}],"no")+"<div id=resideCond style=margin-top:22px></div>";bindSub("reside",function(v){document.getElementById("resideCond").innerHTML=v==="yes"?fld("locInput","In what location must employees reside?",""):""})}
else{cond.innerHTML=radios("startloc","Does this job have a consistent starting location?",[{v:"yes",t:"Yes"},{v:"no",t:"No"}],"yes")+"<div id=startCond style=margin-top:22px></div>";bindSub("startloc",function(v){document.getElementById("startCond").innerHTML=v==="yes"?fld("locInput","Enter the street address of the starting location",""):fld("locInput","What is the operating area for this job?","")});document.getElementById("startCond").innerHTML=fld("locInput","Enter the street address of the starting location","")}
}
function bindSub(name,cb){cond.querySelectorAll("input[name="+name+"]").forEach(function(r){r.addEventListener("change",function(){cb(r.value)})})}
function renderMenu(){menu.innerHTML=OPTS.map(function(o){return "<button type=button class=\"sel-opt"+(o.v===cur?" on":"")+"\" data-v="+o.v+"><span class=ck>"+(o.v===cur?"\u2713":"")+"</span>"+o.long+"</button>"}).join("")}
sel.querySelector(".sel-btn").addEventListener("click",function(e){e.stopPropagation();sel.classList.toggle("open")});
menu.addEventListener("click",function(e){var b=e.target.closest(".sel-opt");if(!b)return;cur=b.dataset.v;var o=OPTS.filter(function(x){return x.v===cur})[0];lab.textContent=o.short;sel.classList.remove("open");renderMenu();renderCond()});
document.addEventListener("click",function(){sel.classList.remove("open")});
function renderTpl(q){var list=TPL.filter(function(t){return !q||t.n.toLowerCase().indexOf(q.toLowerCase())>-1});
document.getElementById("tplCount").textContent=list.length+(list.length===1?" result":" results");
document.getElementById("tplList").innerHTML=list.map(function(t){return "<button type=button class=tpl-item><div class=tpl-name>"+t.n+"</div><div class=tpl-meta>"+t.m+"</div></button>"}).join("")}
document.getElementById("tplSearch").addEventListener("input",function(e){renderTpl(e.target.value)});
document.querySelectorAll("input[name=mode]").forEach(function(r){r.addEventListener("change",function(){var t=r.value==="template";document.getElementById("tplBlock").classList.toggle("hide",!t);document.getElementById("newBlock").classList.toggle("hide",t)})});
renderMenu();renderCond();renderTpl("");
})();
</script>
</body>

<span class="q">How would you like to create your agent? <span class="req">*</span></span>
<label class="radio-row"><input type="radio" name="mode" value="template"><span class="radio-label">Use a previous agent as a template<br><span class="badge">Save time</span></span></label>
<label class="radio-row"><input type="radio" name="mode" value="new" checked><span class="radio-label">Create a brand new agent</span></label>
<div id="tplBlock" class="hide">
<div class="tpl-card">
<div class="tpl-search-wrap"><div class="tpl-search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg><input type="text" id="tplSearch" placeholder="Search by agent title"></div></div>
<div class="tpl-count"><svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg><span id="tplCount">4 results</span></div>
<div id="tplList"></div>
</div></div>
<div id="newBlock">
<hr>
<label class="fld" for="jobTitle">Job title <span class="req">*</span></label>
<input type="text" id="jobTitle">
<hr>
<label class="fld">Job location type <span class="req">*</span></label>
<div class="sel" id="locSel">
<button type="button" class="sel-btn"><span id="locLabel">In person</span><svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg></button>
<div class="sel-menu" id="locMenu"></div>
</div>
<div id="locCond" style="margin-top:26px"></div>
</div>
<div class="actions"><button class="btn-primary">Continue <svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></button></div>
</div></div>
</div></div>
<script>
(function(){
var OPTS=[
{v:"inperson",short:"In person",long:"In person"},
{v:"remote",short:"Fully remote",long:"Fully remote: no on-site work required"},
{v:"hybrid",short:"Hybrid",long:"Hybrid: some on-site work required"},
{v:"road",short:"On the road",long:"On the road"}];
var cur="inperson";
var TPL=[{n:"Registered Nurse",m:"Dallas, TX \u00b7 July 28th, 2026"},{n:"Certified Nursing Assistant",m:"Pittsburgh, PA \u00b7 July 25th, 2026"},{n:"Warehouse Associate",m:"Austin, TX \u00b7 July 23rd, 2026"},{n:"RN Care Manager",m:"Houston, TX \u00b7 July 16th, 2026"}];
var sel=document.getElementById("locSel"),menu=document.getElementById("locMenu"),lab=document.getElementById("locLabel"),cond=document.getElementById("locCond");
function fld(id,label,helper){var h="<label class=fld for="+id+">"+label+" <span class=req>*</span></label>";if(helper)h+="<div class=helper>"+helper+"</div>";h+="<input type=text id="+id+">";return h}
function radios(name,q,opts,def){var h="<span class=q>"+q+"</span>";opts.forEach(function(o){h+="<label class=radio-row><input type=radio name="+name+" value="+o.v+(o.v===def?" checked":"")+"><span class=radio-label>"+o.t+"</span></label>"});return h}
function renderCond(){
if(cur==="inperson"){cond.innerHTML=fld("locInput","What is the job location?","Enter a street address or ZIP code")}
else if(cur==="hybrid"){cond.innerHTML=fld("locInput","Street address","")}
else if(cur==="remote"){cond.innerHTML=radios("reside","Are employees required to reside in a specific location?",[{v:"yes",t:"Yes"},{v:"no",t:"No"}],"no")+"<div id=resideCond style=margin-top:22px></div>";bindSub("reside",function(v){document.getElementById("resideCond").innerHTML=v==="yes"?fld("locInput","In what location must employees reside?",""):""})}
else{cond.innerHTML=radios("startloc","Does this job have a consistent starting location?",[{v:"yes",t:"Yes"},{v:"no",t:"No"}],"yes")+"<div id=startCond style=margin-top:22px></div>";bindSub("startloc",function(v){document.getElementById("startCond").innerHTML=v==="yes"?fld("locInput","Enter the street address of the starting location",""):fld("locInput","What is the operating area for this job?","")});document.getElementById("startCond").innerHTML=fld("locInput","Enter the street address of the starting location","")}
}
function bindSub(name,cb){cond.querySelectorAll("input[name="+name+"]").forEach(function(r){r.addEventListener("change",function(){cb(r.value)})})}
function renderMenu(){menu.innerHTML=OPTS.map(function(o){return "<button type=button class=\"sel-opt"+(o.v===cur?" on":"")+"\" data-v="+o.v+"><span class=ck>"+(o.v===cur?"\u2713":"")+"</span>"+o.long+"</button>"}).join("")}
sel.querySelector(".sel-btn").addEventListener("click",function(e){e.stopPropagation();sel.classList.toggle("open")});
menu.addEventListener("click",function(e){var b=e.target.closest(".sel-opt");if(!b)return;cur=b.dataset.v;var o=OPTS.filter(function(x){return x.v===cur})[0];lab.textContent=o.short;sel.classList.remove("open");renderMenu();renderCond()});
document.addEventListener("click",function(){sel.classList.remove("open")});
function renderTpl(q){var list=TPL.filter(function(t){return !q||t.n.toLowerCase().indexOf(q.toLowerCase())>-1});
document.getElementById("tplCount").textContent=list.length+(list.length===1?" result":" results");
document.getElementById("tplList").innerHTML=list.map(function(t){return "<button type=button class=tpl-item><div class=tpl-name>"+t.n+"</div><div class=tpl-meta>"+t.m+"</div></button>"}).join("")}
document.getElementById("tplSearch").addEventListener("input",function(e){renderTpl(e.target.value)});
document.querySelectorAll("input[name=mode]").forEach(function(r){r.addEventListener("change",function(){var t=r.value==="template";document.getElementById("tplBlock").classList.toggle("hide",!t);document.getElementById("newBlock").classList.toggle("hide",t)})});
renderMenu();renderCond();renderTpl("");
})();
</script>
</body>
</html>
