<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JobFairX — Schedule &amp; Reschedule</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════
   Tokens — identical set to jobseeker-v1.html, which took them
   from the Employer app (visual-v3 / lobby-v3).
   ═══════════════════════════════════════════════════════════ */
:root{
  --font:'Noto Sans',-apple-system,BlinkMacSystemFont,sans-serif;
  --blue:#0044B3; --blue-hover:#003399; --blue-wash:#f0f5ff;
  --ink:#2d2d2d; --ink-2:#595959; --ink-3:#767676; --ink-disabled:#b0afad;
  --page:#f3f2ef; --surface:#fff; --border:#d4d2d0; --divider:#ebebeb;
  --green:#16a34a; --green-solid:#1e7e34; --green-solid-wash:#e6f4ea;
  --red:#991b1b; --red-wash:#fef2f2; --amber:#8a5c00; --amber-wash:#fdf6ec;
  --t-xs:12px; --t-sm:13px; --t-base:14px; --t-md:16px; --t-lg:17px; --t-xl:20px; --t-2xl:22px;
  --r-sm:6px; --r-md:8px; --r-lg:12px; --r-xl:16px;
  --shadow-menu:0 4px 20px rgba(0,0,0,.12);
  --shadow-modal: 0 8px 32px rgba(0,0,0,0.2);
  /* Measured at runtime: the dev bar wraps to two or three rows on narrow
     screens, so a fixed offset buries the white bar underneath it. */
  --devbar-h:44px;
  --chrome-h:100px;
}
*{margin:0;padding:0;box-sizing:border-box}
/* Both bars are fixed, so anything scrolled to must clear them. */
html{scroll-padding-top:calc(var(--chrome-h) + 16px)}
body{font-family:var(--font);background:var(--page);color:var(--ink);font-size:var(--t-base);line-height:1.5;-webkit-font-smoothing:antialiased}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:3px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media (prefers-reduced-motion:reduce){*{transition-duration:.001ms!important;animation-duration:.001ms!important}}
a{color:var(--blue)}

/* ═══ DEV TOGGLES ═══ */
.devbar{position:fixed;top:0;left:0;right:0;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;padding:6px 16px;z-index:400;flex-wrap:wrap}
.dev-toggle{display:flex;align-items:center;gap:5px;padding:3px 8px;background:var(--page);border-radius:5px;border:1px solid var(--border)}
.dev-toggle-label{font-size:9px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
.dev-toggle-switch{display:flex;background:#e0e0e0;border-radius:3px;overflow:hidden}
.dev-toggle-btn{padding:3px 7px;font-size:10px;font-weight:700;border:none;background:transparent;cursor:pointer;font-family:inherit;color:var(--ink-3);transition:all .15s}
.dev-toggle-btn.active{background:var(--blue);color:#fff}
.devbar-note{margin-left:auto;font-size:var(--t-sm);color:var(--ink-2)}
/* Inside the dashboard's phone frame this is a document, not a workbench:
   every piece of prototype scaffolding goes. fitDevbar() then measures the
   hidden bar as 0 and everything below it moves up on its own. */
body.embed .devbar,body.embed .topbar-method{display:none}

/* ═══ TOP BAR ═══ */
.topbar{position:fixed;top:var(--devbar-h);left:0;right:0;min-height:56px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px 16px;padding:8px 24px;z-index:200;flex-wrap:wrap}
/* The variation belongs next to the logo, not up in the grey bar: which
   format you are booking changes what this flow asks for, so it should be
   switchable while you are looking at the times. */
.topbar-method{flex-shrink:1;min-width:0}
.topbar-method .dev-toggle-switch{flex-wrap:nowrap}
.brand{font-size:var(--t-2xl);font-weight:800;color:var(--blue);letter-spacing:-.5px;text-decoration:none}

/* ═══ NARROW FLOW COLUMN — Indeed's shape ═══ */
.flow{max-width:560px;margin:0 auto;padding:calc(var(--chrome-h) + 32px) 20px 80px}
.ctx{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:20px 24px;margin-bottom:16px}
.ctx b{display:block;font-size:var(--t-base);font-weight:700;line-height:1.4}
.ctx span{font-size:var(--t-sm);color:var(--ink-3)}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:24px}

/* ═══ PROGRESS ═══ */
.bar{height:6px;background:var(--divider);border-radius:999px;overflow:hidden;margin-bottom:18px}
.bar i{display:block;height:100%;background:var(--blue);border-radius:999px;transition:width .3s}
.steprow{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.backarrow{background:none;border:none;cursor:pointer;color:var(--ink);display:flex;align-items:center;padding:2px;border-radius:var(--r-sm)}
.backarrow:hover{background:var(--page)}
.stepn{font-size:var(--t-base);font-weight:700;color:var(--ink)}
h1{font-size:26px;font-weight:700;letter-spacing:-.4px;line-height:1.2;margin-bottom:18px}

/* ═══ DETAIL ROWS ═══ */
.drow{display:flex;gap:12px;margin-bottom:12px;align-items:flex-start}
.drow svg{width:20px;height:20px;flex-shrink:0;color:var(--ink-2);margin-top:1px}
.drow .v{font-size:var(--t-base);line-height:1.5}
.rule{height:1px;background:var(--divider);margin:20px 0}

/* ═══ SELECT A TIME ═══ */
h2.sec{font-size:var(--t-xl);font-weight:700;margin-bottom:8px}
.tzrow{display:flex;align-items:center;gap:7px;font-size:var(--t-base);color:var(--ink);margin-bottom:12px}
.tzrow svg{width:16px;height:16px;color:var(--ink-2)}
.tzrow button{background:none;border:none;cursor:pointer;color:var(--blue);display:flex;align-items:center;padding:2px;border-radius:var(--r-sm)}
.banner{background:var(--blue-wash);border-radius:var(--r-md);padding:14px 16px;display:flex;gap:12px;margin-bottom:16px}
.banner svg{width:20px;height:20px;color:var(--blue);flex-shrink:0;margin-top:1px}
.banner .bt{font-size:var(--t-base);line-height:1.5}
.banner .bt b{font-weight:700}
.banner button{display:block;margin-top:10px;background:var(--blue);color:#fff;border:none;border-radius:999px;padding:8px 18px;font-family:inherit;font-size:var(--t-base);font-weight:700;cursor:pointer}
.banner button:hover{background:var(--blue-hover)}
.dayhead{font-size:var(--t-base);font-weight:700;color:var(--ink);margin:0 0 8px}
.slots{border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden}
.slot{display:flex;align-items:flex-start;gap:14px;padding:16px 18px;border-top:1px solid var(--divider);cursor:pointer;background:var(--surface);width:100%;text-align:left;font-family:inherit;border-left:none;border-right:none;border-bottom:none;transition:background .12s}
.slot:first-child{border-top:none}
.slot:hover:not(.taken){background:var(--page)}
.slot.sel{background:var(--blue-wash)}
.slot.taken{cursor:default;background:#f7f6f5}
.radio{width:20px;height:20px;border:2px solid var(--ink-2);border-radius:50%;flex-shrink:0;margin-top:1px;position:relative}
.slot.sel .radio{border-color:var(--ink)}
.slot.sel .radio::after{content:'';position:absolute;inset:3px;border-radius:50%;background:var(--ink)}
.slot.taken .radio{border-color:var(--ink-disabled)}
/* The rounded containers clip an outset ring off these rows' left and right. */
.slot:focus-visible,.opt:focus-visible{outline-offset:-3px}
.slot .st{font-size:var(--t-md);color:var(--ink)}
.slot.taken .st{color:var(--ink-2)}
.slot .sub{display:block;font-size:var(--t-base);color:var(--ink-3);font-style:italic;margin-top:3px}

/* ═══ VALIDATION + BUTTONS ═══ */
.valid{display:flex;gap:10px;align-items:center;margin:22px 0 12px;font-size:var(--t-base);color:#a3006b;font-style:italic}
.valid svg{width:20px;height:20px;flex-shrink:0}
.btn{display:block;width:100%;padding:15px 24px;border-radius:var(--r-md);font-size:var(--t-md);font-weight:700;cursor:pointer;font-family:inherit;border:1px solid transparent;text-align:center;transition:all .15s}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:hover{background:var(--blue-hover)}
.btn-primary:disabled{background:#a8bce0;cursor:not-allowed}
.btn-secondary{background:var(--surface);color:var(--blue);border-color:var(--border);margin-top:12px}
.btn-secondary:hover{background:var(--page);border-color:var(--blue)}

/* ═══ REVIEW ═══ */
.fieldset{border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden;margin-bottom:20px}
.field{padding:14px 18px;border-top:1px solid var(--divider)}
.field:first-child{border-top:none}
.field .k{font-size:var(--t-sm);color:var(--ink-2);margin-bottom:2px}
.field .v{font-size:var(--t-md);font-weight:700}
.seclabel{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
.seclabel .l{font-size:var(--t-sm);font-weight:700;color:var(--ink-2)}
.seclabel button{background:none;border:none;cursor:pointer;color:var(--blue);font-family:inherit;font-size:var(--t-base);font-weight:700;padding:2px;border-radius:var(--r-sm)}
.timebox{border:1px solid var(--border);border-radius:var(--r-md);padding:16px 18px}
.timebox .d{font-size:var(--t-md);font-weight:700;margin-bottom:2px}
.timebox .t{font-size:var(--t-base);color:var(--ink)}
.timebox .z{font-size:var(--t-base);color:var(--ink-2)}
/* before → after, which Indeed does not show */
.delta{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.delta .was{color:var(--ink-3);text-decoration:line-through}
.delta svg{width:18px;height:18px;color:var(--ink-2);flex-shrink:0}
.legal{font-size:var(--t-sm);color:var(--ink-2);line-height:1.55;margin:18px 0}

/* ═══ MODAL ═══ same component as the dashboard's, same measurements. */
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9999;align-items:center;justify-content:center;padding:20px}
.ov.open{display:flex}
.modal{background:var(--surface);border-radius:14px;width:520px;max-width:100%;box-shadow:var(--shadow-modal);max-height:90vh;overflow-y:auto}
.modal-h{display:flex;justify-content:space-between;align-items:flex-start;padding:24px 24px 0;gap:12px}
.modal-h h3{font-size:var(--t-xl);font-weight:700}
.modal-x{width:32px;height:32px;border:none;background:none;cursor:pointer;color:var(--ink-2);border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.modal-x:hover{background:var(--page)}
.modal-b{padding:18px 24px;font-size:var(--t-base);line-height:1.6;color:var(--ink)}
.modal-f{display:flex;justify-content:flex-end;gap:12px;padding:0 24px 24px}
/* .btn is a full-width block in this flow; in a dialog footer it is not. */
.modal-f .btn{width:auto;display:inline-flex;align-items:center;justify-content:center;padding:12px 24px}
/* Indeed renders the whole document on this screen rather than a filename, so
   this is a document surface, not a field group: rounder than the fieldsets
   beside it, and centred at the head the way a resume is. 20px on Indeed;
   --r-xl keeps it on our scale and still reads as the odd one out. */
.resbox{border:1px solid var(--border);border-radius:var(--r-xl);background:var(--surface);padding:22px 20px;margin-bottom:20px}
.resbox .rname{font-size:var(--t-2xl);font-weight:700;text-align:center;line-height:1.25}
.resbox .rcon{font-size:var(--t-base);color:var(--ink-2);text-align:center;margin-top:4px}
.resbox .rrule{height:2px;background:var(--ink);margin:16px 0}
.resbox .rsec{font-size:var(--t-md);font-weight:700;text-align:center;margin-bottom:8px}
.resbox .rbody{font-size:var(--t-base);line-height:1.55;margin-bottom:18px}
.resbox .rbody:last-child{margin-bottom:0}
.noresume{border:1px solid var(--border);border-radius:var(--r-md);padding:14px 18px;margin-bottom:20px;font-size:var(--t-base);color:var(--ink-2)}

/* ═══ CONFIRMATION ═══ */
.ticks{margin-bottom:20px}
.tick{display:flex;gap:12px;align-items:flex-start;margin-bottom:10px;font-size:var(--t-md);line-height:1.5}
.tick svg{width:20px;height:20px;color:var(--green-solid);flex-shrink:0;margin-top:2px}
.detailcard{border:1px solid var(--border);border-radius:var(--r-md);padding:18px;margin-bottom:20px}
.detailcard h3{font-size:var(--t-md);font-weight:700;margin-bottom:12px}
.detailcard .rule{margin:12px 0}
.nextup{border-top:1px solid var(--divider);padding-top:20px}
.nextup h3{font-size:var(--t-md);font-weight:700;margin-bottom:4px}
.nextup p{font-size:var(--t-base);color:var(--ink-2);margin-bottom:14px}

/* ═══ FAIL / LOCKED ═══ */
.failart{width:150px;height:auto;margin:4px 0 22px}
.failp{font-size:var(--t-md);line-height:1.6;margin-bottom:18px}
.ph{background:#fff6d9;border-bottom:1px dashed #b8860b;color:#7a5c00;font-weight:600;padding:0 3px;border-radius:2px}
.foot{text-align:center;font-size:var(--t-sm);color:var(--ink-2);margin-top:22px}

/* ═══ SCREENER ═══ */
.q{margin-bottom:24px}
.q .qt{font-size:var(--t-md);font-weight:700;margin-bottom:10px;line-height:1.45}
.opts{border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden}
.opt{display:flex;align-items:center;gap:14px;padding:14px 18px;border-top:1px solid var(--divider);cursor:pointer;background:var(--surface);width:100%;text-align:left;font-family:inherit;font-size:var(--t-base);border-left:none;border-right:none;border-bottom:none}
.opt:first-child{border-top:none}
.opt:hover{background:var(--page)}
.opt.sel{background:var(--blue-wash)}
.opt.sel .radio{border-color:var(--ink)}
.opt.sel .radio::after{content:'';position:absolute;inset:3px;border-radius:50%;background:var(--ink)}
.qnote{font-size:var(--t-sm);color:var(--ink-2);margin-bottom:20px;line-height:1.55}

@media (max-width:640px){
  .flow{padding:calc(var(--chrome-h) + 26px) 14px 70px}
  .topbar{padding:8px 14px}
  .topbar-method .dev-toggle-btn{padding:6px 8px}
  .panel{padding:20px 18px}
  h1{font-size:23px}

  /* Get the times on screen: the pre-amble was consuming the first 660px. */
  .ctx{padding:14px 16px}
  .drow{margin-bottom:9px}
  .rule{margin:14px 0}
  h2.sec{font-size:var(--t-md);margin-bottom:6px}
  .banner{padding:11px 13px;margin-bottom:12px}
  .banner .bt{font-size:var(--t-sm)}
  .banner button{padding:9px 16px;min-height:44px}
  .slot{padding:13px 14px;min-height:48px}
  .slot .st{font-size:var(--t-base)}
  .slot .sub{font-size:var(--t-sm)}
  .btn{padding:14px 20px;min-height:48px}
  .opt{padding:13px 16px;min-height:48px}
  .q .qt{font-size:var(--t-base)}
  .field{padding:12px 14px}
  .timebox{padding:14px}
  .resbox{padding:18px 16px}
  .resbox .rname{font-size:var(--t-xl)}
  .noresume{padding:12px 14px}
  .failart{width:120px}

  /* 44px floor. These were the last content controls under it: the footer
     link (18px), the back arrow (26px), the Edit buttons (23px/19px), the
     timezone pencil (20px) and the brand (33px). Icon-only controls get a
     min box rather than padding so the rows they sit in do not shift. */
  .brand{display:inline-flex;align-items:center;min-height:44px}
  .backarrow{min-height:44px;min-width:44px;justify-content:center;margin-left:-10px}
  .tzrow button{min-height:44px;min-width:44px;justify-content:center}
  /* Height was raised last session; width was not, leaving these at 35x44. */
  .seclabel button{min-height:44px;min-width:44px;padding:0 4px}
  .modal-x{min-width:44px;min-height:44px}
  .foot a{display:inline-block;padding:13px 8px}
  .drow a{display:inline-block;min-width:44px;padding:12px 0}
}
</style>
</head>
<body>

<div class="devbar" role="region" aria-label="Prototype state controls">
  <div class="dev-toggle">
    <span class="dev-toggle-label">Flow:</span>
    <div class="dev-toggle-switch" id="tgFlow">
      <button class="dev-toggle-btn active" onclick="setFlow('reschedule',this)">Reschedule flow</button>
      <button class="dev-toggle-btn" onclick="setFlow('schedule',this)">First booking</button>
    </div>
  </div>
  <div class="dev-toggle">
    <span class="dev-toggle-label">Step:</span>
    <div class="dev-toggle-switch" id="tgStep">
      <button class="dev-toggle-btn" onclick="setStep('screener',this)">Screener</button>
      <button class="dev-toggle-btn" onclick="setStep('failed',this)">Failed</button>
      <button class="dev-toggle-btn active" onclick="setStep('time',this)">Select time</button>
      <button class="dev-toggle-btn" onclick="setStep('review',this)">Review</button>
      <button class="dev-toggle-btn" onclick="setStep('done',this)">Confirmed</button>
    </div>
  </div>
  <div class="dev-toggle">
    <span class="dev-toggle-label">Capacity:</span>
    <div class="dev-toggle-switch" id="tgCap">
      <button class="dev-toggle-btn active" onclick="setCap('some',this)">Some full</button>
      <button class="dev-toggle-btn" onclick="setCap('all',this)">All open</button>
    </div>
  </div>
  <div class="dev-toggle">
    <span class="dev-toggle-label">Resume:</span>
    <div class="dev-toggle-switch" id="tgResume">
      <button class="dev-toggle-btn active" onclick="setResume('req',this)">Required</button>
      <button class="dev-toggle-btn" onclick="setResume('none',this)">Not required</button>
    </div>
  </div>
  <div class="devbar-note">jordan.reyes@example.com</div>
</div>

<div class="topbar">
  <a class="brand" href="jobseeker-v2.html">JobFairX</a>
  <div class="dev-toggle topbar-method">
    <span class="dev-toggle-label">Method:</span>
    <div class="dev-toggle-switch" id="tgMethod">
      <button class="dev-toggle-btn active" onclick="setMethod('video',this)">JobFairX video</button>
      <button class="dev-toggle-btn" onclick="setMethod('link',this)">External link</button>
      <button class="dev-toggle-btn" onclick="setMethod('phone',this)">Phone call</button>
      <button class="dev-toggle-btn" onclick="setMethod('person',this)">In person</button>
    </div>
  </div>
</div>

<main class="flow">
  <div class="ctx" id="ctx"></div>
  <div class="panel" id="panel"></div>
  <p class="foot">Having an issue? <a href="#" onclick="return false">Tell us more</a></p>
</main>

<!-- The resume edit layout already exists outside this prototype, so the three
     actions that would open it say so rather than inventing an editor. -->
<div class="ov" id="ov" onclick="if(event.target===this)closeResumeEditor()">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <div class="modal-h">
      <h3 id="mTitle">Resume</h3>
      <button class="modal-x" aria-label="Close" onclick="closeResumeEditor()">&times;</button>
    </div>
    <div class="modal-b">Developer: use current edit layout.</div>
    <div class="modal-f">
      <button class="btn btn-primary" id="mClose" onclick="closeResumeEditor()">Close</button>
    </div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════
   MODEL
   Event window is 11:00 AM – 3:00 PM, every 30 minutes.
   Employers set how many candidates they take per slot; a slot
   at capacity is not rendered at all — same as Indeed omitting
   rather than disabling. The only disabled row is the one the
   candidate already holds.
   ═══════════════════════════════════════════════════════════ */
/* ═══════════════════════════════════════════════════════════
   WHERE THE CANDIDATE CAME FROM
   The dashboard owns the interview records, so it hands this flow the values
   to display rather than the flow keeping a second copy of the same facts.
   Opened bare \u2014 from the header control, or directly \u2014 everything falls back
   to the sample booking below, which is what the flow showed before.
   ═══════════════════════════════════════════════════════════ */
function qp(k){
  var m=location.search.match(new RegExp('[?&]'+k+'=([^&]*)'));
  return m ? decodeURIComponent(m[1].replace(/\+/g,' ')) : null;
}
/* Anything rendered through innerHTML and sourced from the URL gets escaped
   once, here, rather than at every use. */
function esc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function qpEsc(k,d){var v=qp(k);return esc(v===null?d:v);}
/* An unknown value falls through to the default instead of rendering a step
   that does not exist. */
function qpOne(k,allowed,d){var v=qp(k);return allowed.indexOf(v)>=0?v:d;}

var EVENT = {
  job:  qpEsc('job','Registered Nurse'),
  co:   qpEsc('co','Baylor Scott & White'),
  ev:   qpEsc('ev','Dallas Healthcare Hiring Event'),
  date: qpEsc('date','Wednesday, April 22, 2026'),
  tz:   qpEsc('tz','Central Daylight Time (CDT)')
};
/* The slot heading drops the year; the slot rows carry the abbreviation. */
EVENT.day = EVENT.date.replace(/,\s*\d{4}$/,'');
EVENT.tzShort = (EVENT.tz.match(/\(([^)]+)\)/)||[null,EVENT.tz])[1];

/* The method comes from the event, not the candidate. What it changes here:
   what we confirm before booking, and what the next step is afterwards. */
var METHODS = {
  video: {l:'JobFairX video call', sent:'This will be a JobFairX video call', pre:'You\u2019ll join from your Interviews tab at your interview time.',
          nextH:'Test your camera and microphone', nextP:'Do it now so there are no surprises on the day.', nextC:'Test my device'},
  link:  {l:'Employer\u2019s video call', sent:'This interview uses the employer\u2019s own video platform', pre:'\u2019'+'s video link arrives once they approve your interview \u2014 by email and on your Interviews tab.',
          nextH:'Watch for the video link', nextP:'It arrives once the employer approves your interview. Nothing to do until then.', nextC:'Go to my interviews'},
  phone: {l:'Phone call', sent:'This will be a phone call', pre:'The employer will call you. Check the number below is right.',
          nextH:'Keep your ringer on', nextP:'There\u2019s nothing to join \u2014 the employer calls you at your interview time.', nextC:'Check my number'},
  person:{l:'In person', sent:'This interview is in person', pre:'You\u2019ll get the address once they approve your interview.',
          nextH:'Plan your travel', nextP:'Check the address and parking before the day.', nextC:'Get directions',
          /* A first booking is only a request, so there is no address yet and
             nothing to get directions to. */
          reqP:'The address arrives once they approve your interview. Nothing to do until then.', reqC:'Go to my interviews'}
};
var TEL='(555) 014-2278';
function MT(){return METHODS[S.method];}
var CURRENT = qpEsc('cur','11:00 AM - 11:30 AM');

var SLOTS = [
  {t:'11:00 AM - 11:30 AM', full:false},
  {t:'11:30 AM - 12:00 PM', full:false},
  {t:'12:00 PM - 12:30 PM', full:true },
  {t:'12:30 PM - 1:00 PM',  full:false},
  {t:'1:00 PM - 1:30 PM',   full:false},
  {t:'1:30 PM - 2:00 PM',   full:false},
  {t:'2:00 PM - 2:30 PM',   full:true },
  {t:'2:30 PM - 3:00 PM',   full:false}
];

var S = { flow:   qpOne('flow',  ['reschedule','schedule'],'reschedule'),
          step:   qpOne('step',  ['screener','failed','time','review','done'],'time'),
          cap:    qpOne('cap',   ['some','all'],'some'),
          method: qpOne('method',['video','link','phone','person'],'video'),
          resume: qpOne('resume',['req','none'],'req'),
          picked:null, answers:[null,null,null] };

var SCREENER = [
  { q:'Do you have an active Registered Nurse licence in the state of Texas?', a:['Yes','No, but I am in the process of obtaining one','No'] },
  { q:'How many years of experience do you have as a Registered Nurse?', a:['Less than 1 year','1–3 years','4–6 years','7+ years'] },
  { q:'Are you available to work night shifts?', a:['Yes','No','Depends on the schedule'] }
];

/* ═══ ICONS ═══ */
var IC = {
  cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>',
  people:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13A4 4 0 0119 7a4 4 0 01-3 3.87"/></svg>',
  globe:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 010 20 15 15 0 010-20"/></svg>',
  pencil:'<svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16"><path d="M16.7 2.6a2.7 2.7 0 013.8 3.8l-1.2 1.2-3.8-3.8 1.2-1.2zM14.2 5.1l3.8 3.8L7.4 19.5l-4.6 1.3 1.3-4.6L14.2 5.1z"/></svg>',
  info:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>',
  arrow:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>'
};
function ph(t){return '<span class="ph">['+t+']</span>';}
/* Add resume, Edit and Review resume all land here. Nothing is built behind
   it on purpose \u2014 the real layout exists outside this prototype, so the modal
   carries the instruction instead of an invented editor. */
var resumeReturn=null;
function openResumeEditor(btn){
  resumeReturn = btn || null;
  document.getElementById('ov').classList.add('open');
  document.getElementById('mClose').focus();
}
function closeResumeEditor(){
  document.getElementById('ov').classList.remove('open');
  /* Send focus back where it was, or closing strands a keyboard user at the
     top of the document. */
  if(resumeReturn && resumeReturn.focus) resumeReturn.focus();
  resumeReturn=null;
}
document.addEventListener('keydown',function(e){
  if(e.key==='Escape' && document.getElementById('ov').classList.contains('open')) closeResumeEditor();
});
var isRe = function(){return S.flow==='reschedule';};

/* ═══ TOGGLES ═══ */
function setFlow(v,b){S.flow=v;S.picked=null;mark('tgFlow',b);
  /* A first booking has no screener-independent "current time", and the
     Locked state only means anything once something is booked. */
  render();}
function setStep(v,b){S.step=v;mark('tgStep',b);render();}
function setMethod(v,b){S.method=v;mark('tgMethod',b);render();}
function setCap(v,b){S.cap=v;S.picked=null;mark('tgCap',b);render();}
/* Stays live on a reschedule even though the section itself is first-booking
   only: whether a resume exists still decides what the legal line can claim. */
function setResume(v,b){S.resume=v;mark('tgResume',b);render();}
function mark(id,btn){document.querySelectorAll('#'+id+' .dev-toggle-btn').forEach(function(x){x.classList.remove('active')});btn.classList.add('active');}
function jump(step){S.step=step;
  document.querySelectorAll('#tgStep .dev-toggle-btn').forEach(function(x){
    x.classList.toggle('active', x.textContent.toLowerCase().indexOf(({screener:'screener',failed:'failed',time:'select',review:'review',done:'confirmed'})[step])===0);
  });
  render();window.scrollTo(0,0);}

/* ═══ SLOT LIST ═══ */
function visibleSlots(){
  /* The slot the candidate already holds reads as full because of them, so it
     survives the filter that hides full slots \u2014 otherwise the row saying which
     time is theirs disappears exactly when it matters. */
  return SLOTS.filter(function(s){
    return S.cap==='all' || !s.full || (isRe() && s.t===CURRENT);
  });
}
function pick(t){ S.picked=t; render(); }

function slotList(){
  var rows=visibleSlots();
  /* An interview booked in another event's window sits outside this 11\u20133 grid.
     Show the time the candidate holds anyway rather than silently omitting it. */
  if(isRe() && !rows.some(function(s){return s.t===CURRENT;}))
    rows=[{t:CURRENT,full:true}].concat(rows);
  var h='<div class="dayhead">'+EVENT.day+'</div><div class="slots" role="radiogroup" aria-label="Available interview times">';
  rows.forEach(function(s){
    var held = isRe() && s.t===CURRENT;
    var sel = S.picked===s.t;
    if(held){
      h+='<div class="slot taken"><span class="radio"></span><span class="st">'+s.t+' '+EVENT.tzShort
        +'<span class="sub">Your currently scheduled interview time</span></span></div>';
    } else {
      h+='<button type="button" role="radio" aria-checked="'+sel+'" class="slot'+(sel?' sel':'')+'" onclick="pick(\''+s.t+'\')">'
        +'<span class="radio"></span><span class="st">'+s.t+' '+EVENT.tzShort+'</span></button>';
    }
  });
  return h+'</div>';
}

/* ═══ RESUME ═══
   Indeed shows the entire resume on review rather than a filename, so the
   candidate reads what the employer will read. The document itself belongs to
   the dashboard's Resume view, which is still a placeholder — so the structure
   is Indeed's and the bodies are placeholders, not an invented career. */
function resumeSection(){
  if(S.resume==='none'){
    return '<div class="seclabel"><span class="l">Resume</span><button onclick="openResumeEditor(this)">Add</button></div>'
     +'<div class="noresume">No resume included (optional)</div>';
  }
  var h='<div class="seclabel"><span class="l">Resume</span><button onclick="openResumeEditor(this)">Edit</button></div>';
  h+='<div class="resbox"><div class="rname">Jordan Reyes</div>'
   +'<div class="rcon">jordan.reyes@example.com \u00b7 '+TEL+'</div>'
   +'<div class="rrule"></div>';
  ['Summary','Work experience','Skills'].forEach(function(sec){
    h+='<div class="rsec">'+sec+'</div><div class="rbody">'
      +ph('PLACEHOLDER \u2014 '+sec.toLowerCase()+' from Jordan\u2019s resume')+'</div>';
  });
  return h+'</div>';
}

/* ═══ STEPS ═══ */
function stepScreener(){
  var done = S.answers.every(function(a){return a!==null});
  var h='<div class="bar"><i style="width:20%"></i></div>';
  h+='<div class="steprow"><span class="stepn">Step 1 of 3</span></div>';
  h+='<h1>A few questions from '+EVENT.co+'</h1>';
  h+='<p class="qnote">'+EVENT.co+' asks every candidate these before booking a time. Your answers go to them with your interview request.</p>';
  SCREENER.forEach(function(item,qi){
    h+='<div class="q"><div class="qt">'+(qi+1)+'. '+item.q+'</div><div class="opts" role="radiogroup" aria-label="Question '+(qi+1)+'">';
    item.a.forEach(function(a,ai){
      var sel=S.answers[qi]===ai;
      h+='<button type="button" role="radio" aria-checked="'+sel+'" class="opt'+(sel?' sel':'')+'" onclick="answer('+qi+','+ai+')"><span class="radio"></span>'+a+'</button>';
    });
    h+='</div></div>';
  });
  if(!done) h+='<div class="valid">'+IC.info+'Answer every question to continue.</div>';
  h+='<button class="btn btn-primary" '+(done?'':'disabled')+' onclick="jump(\'time\')">Continue</button>';
  h+='<button class="btn btn-secondary" onclick="jump(\'failed\')">Preview the fail state</button>';
  return h;
}
function answer(q,a){S.answers[q]=a;render();}

function stepFailed(){
  /* Indeed's screener-fail page, with the exit pointed at our own job search. */
  return '<h1>Thanks for completing our screening</h1>'
   +'<svg class="failart" viewBox="0 0 190 120" fill="none" aria-hidden="true">'
   +'<path d="M14 30l52-14 8 78-52 12z" fill="#f4d3c4"/>'
   +'<rect x="26" y="26" width="46" height="62" rx="3" fill="#fff" stroke="#e5ded9" stroke-width="2"/>'
   +'<path d="M40 8v0" stroke="#a3006b"/>'
   +'<path d="M45 36c0-1.7 1.3-3 3-3s3 1.3 3 3l-.9 20a2.1 2.1 0 01-4.2 0L45 36z" fill="#a3006b"/>'
   +'<circle cx="48" cy="66" r="3.6" fill="#a3006b"/>'
   +'<path d="M56 44h14M56 52h10" stroke="#0044B3" stroke-width="2.4" stroke-linecap="round"/>'
   +'</svg>'
   +'<p class="failp">Unfortunately, based on your answers, it looks like you do not meet the requirements the employer set for this job.</p>'
   +'<p class="failp">The employer may still reach out to you if you are a fit.</p>'
   +'<button class="btn btn-primary" onclick="location.href=\'jobseeker-v2.html?view=events\'">Back to job search</button>';
}

function stepTime(){
  var re=isRe();
  var total = re?2:3, n = re?1:2, pct = re?45:55;
  var h='<div class="bar"><i style="width:'+pct+'%"></i></div>';
  h+='<div class="steprow">'+(re?'':'<button class="backarrow" aria-label="Back" onclick="jump(\'screener\')">'+IC.back+'</button>')+'<span class="stepn">Step '+n+' of '+total+'</span></div>';
  h+='<h1>'+(re?'Reschedule this interview':'Choose your interview time')+'</h1>';

  if(re){
    h+='<div class="drow">'+IC.cal+'<span class="v">'+EVENT.date+'<br>'+CURRENT+'<br>'+EVENT.tz+'</span></div>';
    h+='<div class="drow">'+IC.people+'<span class="v">'+MT().sent+'</span></div>';
  } else {
    h+='<div class="drow">'+IC.cal+'<span class="v">'+EVENT.date+'<br>Interviews run 11:00 AM – 3:00 PM<br>'+EVENT.tz+'</span></div>';
    h+='<div class="drow">'+IC.people+'<span class="v">'+MT().sent+'</span></div>';
  }

  /* What this method needs confirmed before a slot is picked. */
  if(S.method==='phone')  h+='<div class="drow">'+IC.people+'<span class="v">'+MT().pre+'<br><b>'+TEL+'</b> &middot; <a href="#" onclick="toastish(\'Edit number\');return false">Edit</a></span></div>';
  if(S.method==='person' && !re) h+='<div class="drow">'+IC.people+'<span class="v">'+MT().pre+'</span></div>';
  if(S.method==='link' && !re) h+='<div class="drow">'+IC.people+'<span class="v">'+EVENT.co+MT().pre+'</span></div>';
  h+='<div class="rule"></div><h2 class="sec">Select a time</h2>';
  h+='<div class="tzrow">'+IC.globe+EVENT.tz+'<button aria-label="Change time zone" onclick="toastish(\'Change time zone\')">'+IC.pencil+'</button></div>';
  h+='<div class="banner">'+IC.info+'<div class="bt">We have identified your time zone as <b>'+EVENT.tz.replace(' (CDT)','')+'</b>'
   +'<button onclick="toastish(\'Change time zone\')">Change</button></div></div>';
  h+= slotList();

  if(S.cap==='some') h+='<p class="qnote" style="margin-top:12px">Times the employer has already filled aren\'t shown. '+EVENT.co+' set how many candidates they can interview in each 30-minute slot.</p>';

  if(!S.picked) h+='<div class="valid">'+IC.cal+'Select a time for your interview to continue.</div>';
  else h+='<div style="height:22px"></div>';
  h+='<button class="btn btn-primary" '+(S.picked?'':'disabled')+' onclick="jump(\'review\')">Continue</button>';
  if(re) h+='<button class="btn btn-secondary" onclick="toastish(\'Keeping your current time\')">Keep current interview time</button>';
  return h;
}

function stepReview(){
  var re=isRe();
  var total = re?2:3, n = re?2:3;
  var t = S.picked || (re?CURRENT:SLOTS[3].t);
  var h='<div class="bar"><i style="width:95%"></i></div>';
  h+='<div class="steprow"><button class="backarrow" aria-label="Back" onclick="jump(\'time\')">'+IC.back+'</button><span class="stepn">Step '+n+' of '+total+'</span></div>';
  h+='<h1>Here\'s what we\'ll send to the employer</h1>';

  h+='<div class="seclabel"><span class="l">Contact information</span></div>';
  h+='<div class="fieldset"><div class="field"><div class="k">Full name</div><div class="v">Jordan Reyes</div></div>'
   +'<div class="field"><div class="k">Email address</div><div class="v">jordan.reyes@example.com</div></div></div>';

  /* Both flows. This screen says what we send the employer, and the resume goes
     with a reschedule too \u2014 the legal line below asserts exactly that. Screener
     answers stay first-booking only: those are fixed replies to this job's
     questions, already on file, while the resume is the thing a candidate may
     want to swap before the interview. */
  h+=resumeSection();

  h+='<div class="seclabel"><span class="l">'+MT().l+'</span><button onclick="jump(\'time\')">Edit</button></div>';
  h+='<div class="timebox"><div class="d">'+EVENT.date+'</div>';
  if(re){
    /* Before → after. Indeed shows only the new time; a candidate who
       mis-tapped a row can't tell what changed. */
    h+='<div class="delta"><span class="t was">'+CURRENT+'</span>'+IC.arrow+'<span class="t"><b>'+t+'</b></span></div>';
  } else {
    h+='<div class="t">'+t+'</div>';
  }
  h+='<div class="z">'+EVENT.tz+'</div></div>';

  if(!re) h+='<div class="seclabel" style="margin-top:20px"><span class="l">Screener answers</span><button onclick="jump(\'screener\')">Edit</button></div>'
   +'<div class="fieldset"><div class="field"><div class="k">3 questions answered</div><div class="v">Included with your request</div></div></div>';

  /* The resume clause is a claim about what we send. With no resume on file it
     is false in either flow, so it derives rather than sitting in the string. */
  h+='<p class="legal">By '+(re?'rescheduling':'requesting')+' this interview you agree to the JobFairX Terms of Service and Privacy Policy.'
   +(S.resume==='req'?' Your resume is shared with '+EVENT.co+'.':'')+'</p>';
  h+='<button class="btn btn-primary" onclick="jump(\'done\')">'+(re?'Reschedule interview':'Request interview')+'</button>';
  if(re) h+='<button class="btn btn-secondary" onclick="toastish(\'Keeping your current time\')">Keep current interview time</button>';
  return h;
}

function stepDone(){
  var re=isRe();
  var t = S.picked || SLOTS[3].t;
  var h='<div class="bar"><i style="width:100%"></i></div>';
  if(re){
    h+='<h1>All set for your interview with '+EVENT.co+'</h1>';
    h+='<div class="ticks">'
     +'<div class="tick">'+IC.check+'<span>Your interview has been rescheduled</span></div>'
     +'<div class="tick">'+IC.check+'<span>Look for an email from us with your interview details at <b>jordan.reyes@example.com</b></span></div>'
     +'</div>';
    h+='<div class="detailcard"><h3>Updated interview details</h3><div class="rule"></div>'
     +'<div class="drow">'+IC.people+'<span class="v">'+MT().l+'</span></div>'
     +'<div class="drow">'+IC.cal+'<span class="v">'+EVENT.date+'<br>'+t+'<br>'+EVENT.tz+'</span></div></div>';
  } else {
    /* First booking is a request: the candidate names the time, the
       employer accepts or declines it. So this is not "all set" yet. */
    h+='<h1>Your interview request has been sent</h1>';
    h+='<div class="ticks">'
     +'<div class="tick">'+IC.check+'<span>'+EVENT.co+' has your requested time and your screener answers</span></div>'
     +'<div class="tick">'+IC.check+'<span>They usually respond within 72 hours. You\'ll get an email at <b>jordan.reyes@example.com</b></span></div>'
     +'</div>';
    h+='<div class="detailcard"><h3>Requested interview</h3><div class="rule"></div>'
     +'<div class="drow">'+IC.people+'<span class="v">'+MT().l+'</span></div>'
     +'<div class="drow">'+IC.cal+'<span class="v">'+EVENT.date+'<br>'+t+'<br>'+EVENT.tz+'</span></div></div>';
  }

  /* The next step is method-specific: there is no device to test for a
     phone call, and no link to wait for on a JobFairX call. */
  var nP = (!re && MT().reqP) ? MT().reqP : MT().nextP;
  var nC = (!re && MT().reqC) ? MT().reqC : MT().nextC;
  h+='<div class="nextup"><h3>'+MT().nextH+'</h3><p>'+nP+'</p>'
   +'<button class="btn btn-secondary" style="margin-top:0" onclick="toastish(\''+nC+'\')">'+nC+'</button></div>';
  /* Only when one wasn't included \u2014 there is nothing to get ready if it
     already went with the request. */
  if(S.resume==='none')
    h+='<div class="nextup" style="margin-top:18px"><h3>Get your resume ready</h3>'
     +'<p>You may be asked to share your resume before your interview.</p>'
     +'<button class="btn btn-secondary" style="margin-top:0" onclick="openResumeEditor(this)">Review resume</button></div>';
  h+='<button class="btn btn-secondary" onclick="location.href=\'jobseeker-v2.html?view=interviews\'">Back to my interviews</button>';
  return h;
}

function toastish(m){
  var d=document.createElement('div');
  d.textContent=m;
  d.style.cssText='position:fixed;top:calc(var(--chrome-h) + 12px);right:20px;background:#dcfce7;border:1px solid #bbf7d0;color:#14532d;padding:13px 18px;border-radius:8px;font-weight:600;font-size:14px;z-index:9999;box-shadow:var(--shadow-menu)';
  d.setAttribute('role','status');
  document.body.appendChild(d);
  setTimeout(function(){d.remove()},2200);
}

/* The bar is prototype scaffolding that wraps to a different number of rows
   at every width, so nothing below it can assume a fixed offset. */
function fitDevbar(){
  var r=document.documentElement,
      d=document.querySelector('.devbar'),
      t=document.querySelector('.topbar');
  var dh = d ? d.offsetHeight : 44;
  r.style.setProperty('--devbar-h', dh+'px');
  /* Read the white bar only after the grey one has been placed — it wraps
     too, and everything below has to clear both. */
  r.style.setProperty('--chrome-h', (dh + (t ? t.offsetHeight : 56))+'px');
}
window.addEventListener('resize', fitDevbar);
window.addEventListener('load', fitDevbar);
/* Both bars change height when the webfont lands and when they re-wrap, and
   a one-shot measurement at boot reads the pre-font layout. Watch them
   instead. Setting the vars only moves what is below, so this cannot loop. */
if(window.ResizeObserver){
  var ro=new ResizeObserver(fitDevbar);
  ['.devbar','.topbar'].forEach(function(sel){
    var el=document.querySelector(sel); if(el) ro.observe(el);
  });
}
if(document.fonts && document.fonts.ready) document.fonts.ready.then(fitDevbar);

/* The bar has to report the state the flow actually booted into, which the
   URL can set. Derived, never assumed \u2014 the markup's active classes are only
   the fallback's. */
function syncToggles(){
  var order={tgFlow:['reschedule','schedule'],
             tgStep:['screener','failed','time','review','done'],
             tgCap:['some','all'],
             tgResume:['req','none'],
             tgMethod:['video','link','phone','person']},
      now={tgFlow:S.flow,tgStep:S.step,tgCap:S.cap,tgResume:S.resume,tgMethod:S.method};
  Object.keys(order).forEach(function(id){
    var btns=document.querySelectorAll('#'+id+' .dev-toggle-btn');
    order[id].forEach(function(v,i){ if(btns[i]) btns[i].classList.toggle('active', v===now[id]); });
  });
}

function renderCtx(){
  document.getElementById('ctx').innerHTML =
    '<b>'+EVENT.job+'</b><span>'+EVENT.co+' \u00b7 '+EVENT.ev+' \u00b7 '+EVENT.date+'</span>';
}

function render(){
  var p=document.getElementById('panel');
  var f={screener:stepScreener,failed:stepFailed,time:stepTime,review:stepReview,done:stepDone}[S.step];
  p.innerHTML=f();
  /* Screener only exists on a first booking. */
  var scr=document.querySelectorAll('#tgStep .dev-toggle-btn');
  [0,1].forEach(function(i){ scr[i].disabled = isRe(); scr[i].style.opacity = isRe()?'.4':''; });
}
/* Same flag the dashboard's phone frame passes to itself. */
if(/[?&]m=1/.test(location.search)) document.body.classList.add('embed');
syncToggles();
renderCtx();
fitDevbar();
render();
</script>
</body>
</html>
