<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Check-in QR code - JobFairX</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- ═══════════════════════════════════════════════════════════════════════
     THE CHECK-IN SIGN (Scott, 29 Sep 2026)
     Opened from Candidates > Actions > Get QR code for check-in, and from the
     lobby's Check-in QR code link. The employer prints it or shows it on a
     screen at the door.

     Laid out to match Indeed's QR page, measured 29 Sep 2026 from their own
     video: Print and Download at the top left, the name, one line asking the
     candidate to scan, the code, a three-step box, the link typed out for a
     phone that will not scan, and a closing help line. The sentences are
     written for JobFairX.

     Where it differs from Indeed, and why:
       · The heading is the EMPLOYER, with the event beneath it. An Indeed
         event has one employer, so its event name already says who is hiring.
         A JobFairX event has many employers, and the sign hangs on one
         employer's door.
       · One code per employer per event. Every candidate scans the same code.

     NOT BUILT:
       · The typed link is a placeholder. The real build needs a short link
         that a person can type from a sign.
       · The code opens the prototype's check-in page. In the real build it
         carries the employer and the event.
     ═══════════════════════════════════════════════════════════════════════ -->
<style>
:root{
  --font:'Noto Sans',-apple-system,BlinkMacSystemFont,sans-serif;
  --blue:#0044B3; --blue-hover:#003399;
  --ink:#2d2d2d; --ink-2:#595959; --ink-3:#767676;
  --surface:#fff; --border:#d4d2d0;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--surface);color:var(--ink);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:3px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

.bar{display:flex;gap:12px;padding:20px 24px;flex-wrap:wrap}
.b{min-height:44px;padding:0 18px;border-radius:12px;font-family:inherit;font-size:16px;font-weight:700;display:inline-flex;align-items:center;gap:10px;cursor:pointer}
.b svg{width:20px;height:20px;flex:0 0 20px}
.b.pri{background:var(--blue);color:#fff;border:1px solid var(--blue)}
.b.pri:hover{background:var(--blue-hover)}
.b.out{background:var(--surface);color:var(--blue);border:1px solid var(--ink-2)}
.b.out:hover{background:#f3f2ef}

.sheet{max-width:760px;margin:0 auto;padding:8px 24px 56px;text-align:center}
.co{font-size:34px;font-weight:700;letter-spacing:-.4px;line-height:1.2}
.ev{font-size:18px;color:var(--ink-2);margin-top:6px}
.ask{font-size:22px;margin:28px 0 22px}
#qr{display:inline-block;padding:14px;border:1px solid var(--border);border-radius:16px;line-height:0;background:#fff}
#qr svg{width:280px;height:280px;display:block}
.qr-fail{width:280px;padding:40px 20px;font-size:16px;line-height:1.5;color:var(--ink-2)}
.how{max-width:560px;margin:28px auto 0;text-align:left;border:1px solid var(--border);border-radius:12px;padding:18px 22px}
.how h2{font-size:17px;font-weight:700;margin-bottom:8px}
.how ol{margin-left:22px}
.how li{margin:4px 0;font-size:17px}
.alt{margin-top:26px;font-size:18px}
.alt a{display:inline-block;margin-top:6px;font-size:22px;font-weight:700;letter-spacing:.2px;color:var(--ink);text-decoration:none}
/* A removable placeholder, marked so nobody mistakes it for a real link. */
.ph{display:inline-block;background:#fff4d6;border:1px dashed #8a5c00;color:#6b4e00;border-radius:6px;padding:0 10px}
.help{margin-top:22px;font-size:16px;color:var(--ink-2)}
.brand{margin-top:34px;font-size:20px;font-weight:800;color:var(--blue);letter-spacing:-.4px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#2d2d2d;color:#fff;border-radius:12px;padding:12px 20px;font-size:14px;z-index:99}

@media (max-width:600px){
  .bar{padding:16px}
  .sheet{padding:4px 16px 40px}
  .co{font-size:26px}
  .ev{font-size:16px}
  .ask{font-size:19px;margin:22px 0 18px}
  #qr svg{width:230px;height:230px}
  .qr-fail{width:230px}
  .how{padding:16px 18px}
  .how li,.how h2{font-size:16px}
  .alt{font-size:16px}
  .alt a{font-size:18px}
}
@media print{
  .bar,.toast{display:none!important}
  .sheet{padding-top:48px;max-width:none}
  .co{font-size:44px}
  .ev{font-size:22px}
  .ask{font-size:28px}
  #qr{border-color:#000}
  #qr svg{width:380px;height:380px}
  .how li,.how h2{font-size:20px}
}
</style>
</head>
<body>

<div class="bar">
  <button class="b pri" type="button" onclick="window.print()">Print
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 9V3h12v6M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2"/><rect x="6" y="14" width="12" height="7"/></svg>
  </button>
  <button class="b out" type="button" onclick="SIGN.download()">Download
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M4 20h16"/></svg>
  </button>
</div>

<main class="sheet">
  <h1 class="co" id="co"></h1>
  <p class="ev" id="ev"></p>
  <p class="ask">Scan this code to check in for your interview.</p>
  <div id="qr" role="img" aria-label="QR code that opens the check-in page"></div>
  <section class="how" aria-labelledby="howh">
    <h2 id="howh">How to scan</h2>
    <ol>
      <li>Open the camera on your phone.</li>
      <li>Point it at the code and hold it steady.</li>
      <li>Tap the link that appears.</li>
    </ol>
  </section>
  <p class="alt">Can&rsquo;t scan? Go to<br>
    <a id="lnk" href="#"><span class="ph">short check-in link &mdash; placeholder</span></a></p>
  <p class="help">Need help? Ask at the front desk.</p>
  <p class="brand">JobFairX</p>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
(function(){
  /* Prototype data. The employer is the seeker prototype's own in-person
     employer at the same address the lobby shows. */
  var EVENTS = {
    dallas: { co:'Tenet Health', name:'Dallas Healthcare Event', date:'Apr 22, 2026' }
  };
  var key = (location.search.match(/[?&]e=([a-z0-9-]+)/) || [])[1];
  if (!EVENTS[key]) key = 'dallas';
  var E = EVENTS[key];

  var target = new URL('jobseeker-checkin-v1.html', location.href);
  target.search = '?e=' + key;

  document.getElementById('co').textContent = E.co;
  document.getElementById('ev').textContent = E.name + ' · ' + E.date;
  document.getElementById('lnk').href = target.href;
  document.title = 'Check-in QR code · ' + E.co + ' - JobFairX';

  var svgTag = '';
  var box = document.getElementById('qr');
  try {
    var q = qrcode(0, 'M');
    q.addData(target.href);
    q.make();
    svgTag = q.createSvgTag({ cellSize: 8, margin: 0, scalable: true });
    box.innerHTML = svgTag;
  } catch (e) {
    box.innerHTML = '<div class="qr-fail">The code could not be drawn. Reload the page to try again.</div>';
  }

  function toast(m) {
    var d = document.createElement('div');
    d.className = 'toast'; d.setAttribute('role', 'status'); d.textContent = m;
    document.body.appendChild(d);
    setTimeout(function(){ d.remove(); }, 2600);
  }
  function slug(s) { return String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''); }

  /* Download saves the code as a PNG on a white ground with a quiet margin,
     so it still scans when it is placed on a coloured flyer. */
  function download() {
    var svg = box.querySelector('svg');
    if (!svg) { toast('The code is not ready yet.'); return; }
    var xml = new XMLSerializer().serializeToString(svg);
    if (xml.indexOf('xmlns=') < 0) xml = xml.replace('<svg', '<svg xmlns="http://www.w3.org/2000/svg"');
    var img = new Image();
    img.onload = function() {
      var size = 1024, pad = 64;
      var c = document.createElement('canvas');
      c.width = size; c.height = size;
      var g = c.getContext('2d');
      g.fillStyle = '#fff'; g.fillRect(0, 0, size, size);
      g.imageSmoothingEnabled = false;
      g.drawImage(img, pad, pad, size - pad * 2, size - pad * 2);
      var a = document.createElement('a');
      a.download = 'check-in-qr-' + slug(E.co) + '-' + slug(E.name) + '.png';
      a.href = c.toDataURL('image/png');
      document.body.appendChild(a); a.click(); a.remove();
      toast('Code downloaded.');
    };
    img.onerror = function() { toast('The code could not be downloaded.'); };
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(xml);
  }

  window.SIGN = { download: download, target: function(){ return target.href; } };
})();
</script>
</body>
</html>
