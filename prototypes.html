<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JobFairX Prototypes</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--blue:#2563eb;--blue-dark:#1d4ed8;--blue-soft:#eff4ff;--ink:#0f172a;--slate:#475569;--muted:#64748b;--line:#e6e9ef;--bg:#f6f8fc;--white:#fff}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',system-ui,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
  .top{background:var(--white);border-bottom:1px solid var(--line);padding:22px 0}
  .wrap{max-width:1080px;margin:0 auto;padding:0 24px}
  .brand{font-weight:800;font-size:22px;color:var(--blue);letter-spacing:-.02em}
  .sub{font-size:14.5px;color:var(--muted);margin-top:5px}
  .search{margin:22px 0 6px;display:flex;gap:10px;align-items:center}
  .search input{flex:1;border:1px solid var(--line);background:var(--white);border-radius:11px;padding:12px 15px;font-size:15px;font-family:inherit;outline:none}
  .count{font-size:13px;color:var(--muted);margin:18px 0 6px}
  .group{margin-top:26px}
  .group h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--slate);font-weight:700;margin-bottom:12px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
  a.card{display:flex;align-items:center;gap:12px;background:var(--white);border:1px solid var(--line);border-radius:13px;padding:14px 16px;text-decoration:none;color:inherit;transition:border-color .12s,box-shadow .12s}
  a.card:hover{border-color:#c3d5fb;box-shadow:0 6px 18px rgba(15,23,42,.06)}
  .ic{width:34px;height:34px;border-radius:9px;background:var(--blue-soft);color:var(--blue);flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
  .nm{font-size:14.5px;font-weight:600;line-height:1.3}
  .fn{font-size:12px;color:var(--muted);margin-top:2px;word-break:break-all}
  .arw{margin-left:auto;color:var(--muted);flex:0 0 auto}
  .msg{padding:40px 0;color:var(--muted);font-size:14.5px}
  .msg a{color:var(--blue)}
</style>
</head>
<body>
<div class="top"><div class="wrap">
  <div class="brand">JobFairX Prototypes</div>
  <div class="sub">Every prototype and mockup in the repo, in one place. Click any card to open it.</div>
</div></div>
<div class="wrap">
  <div class="search"><input id="q" placeholder="Filter by name..."></div>
  <div class="count" id="count"></div>
  <div id="out"><div class="msg">Loading prototypes...</div></div>
</div>

<script>
const BASE="https://scottjobagent.github.io/jobfairx-prototype/";
const SELF="prototypes.html";
// Category rules: [regex, label]. First match wins; order matters.
const RULES=[
  [/^search-jobs/, "Search Jobs"],
  [/^(jobseeker-dashboard|account-billing|jobfairx-designs)/, "Job Seeker: dashboard & account"],
  [/^(interview|screen-preview|get-ready|interview-loader|interview-requested|candidate|demo-walkthrough)/, "Interview flow"],
  [/^(edit-post|edit-job|post-)/, "Employer: job posting"],
  [/^email-/, "Email templates"],
  [/^(nav-mockup|howitworks-mockup|calendar-mockup)/, "Site design mockups"],
  [/^(diversityhiring|blog-|.*landing)/, "Marketing & landing"],
];
function pretty(fn){
  return fn.replace(/\.html$/,'').replace(/[-_]/g,' ')
    .replace(/\bv(\d)\b/gi,'v$1')
    .replace(/\b\w/g,c=>c.toUpperCase())
    .replace(/Jobfairx/gi,'JobFairX').replace(/\bRn\b/g,'RN').replace(/\bId\b/g,'ID');
}
function categorize(fn){
  for(const [re,label] of RULES){ if(re.test(fn)) return label; }
  return "Other";
}
function render(files){
  // drop self, drop raw email bodies when a -preview viewer exists
  const set=new Set(files);
  files=files.filter(f=>f!==SELF && f!=='index.html');
  files=files.filter(f=>{
    if(/^email-.*(?<!-preview)\.html$/.test(f)){
      const pv=f.replace(/\.html$/,'-preview.html');
      if(set.has(pv)) return false; // prefer the preview viewer
    }
    return true;
  });
  const groups={};
  files.forEach(f=>{ const c=categorize(f); (groups[c]=groups[c]||[]).push(f); });
  const order=["Search Jobs","Job Seeker: dashboard & account","Interview flow","Employer: job posting","Email templates","Site design mockups","Marketing & landing","Other"];
  const cats=Object.keys(groups).sort((a,b)=>{
    const ia=order.indexOf(a), ib=order.indexOf(b);
    return (ia<0?99:ia)-(ib<0?99:ib);
  });
  const total=files.length;
  document.getElementById('count').textContent = total+" prototypes";
  let html="";
  cats.forEach(c=>{
    const items=groups[c].sort();
    html+=`<div class="group"><h2>${c} (${items.length})</h2><div class="grid">`;
    items.forEach(f=>{
      html+=`<a class="card" href="${BASE}${f}" target="_blank" data-n="${(pretty(f)+' '+f).toLowerCase()}">
        <div class="ic">${pretty(f).slice(0,1)}</div>
        <div><div class="nm">${pretty(f)}</div><div class="fn">${f}</div></div>
        <svg class="arw" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17L17 7M17 7H8M17 7v9"/></svg>
      </a>`;
    });
    html+=`</div></div>`;
  });
  document.getElementById('out').innerHTML=html;
}
function filter(){
  const q=document.getElementById('q').value.toLowerCase().trim();
  document.querySelectorAll('a.card').forEach(a=>{ a.style.display = a.dataset.n.includes(q)?'':'none'; });
  document.querySelectorAll('.group').forEach(g=>{ const any=[...g.querySelectorAll('a.card')].some(a=>a.style.display!=='none'); g.style.display=any?'':'none'; });
}
document.getElementById('q').addEventListener('input',filter);
(function(){
  const x=new XMLHttpRequest();
  x.open('GET','https://api.github.com/repos/scottjobagent/jobfairx-prototype/git/trees/main?recursive=1',true);
  x.onload=function(){
    try{
      const j=JSON.parse(x.responseText);
      const files=(j.tree||[]).map(t=>t.path).filter(p=>/^[^/]+\.html$/.test(p));
      if(!files.length) throw new Error('no files');
      render(files);
    }catch(e){
      document.getElementById('out').innerHTML='<div class="msg">Could not load the list automatically. <a href="https://github.com/scottjobagent/jobfairx-prototype" target="_blank">Browse the repo directly</a>.</div>';
    }
  };
  x.onerror=function(){ document.getElementById('out').innerHTML='<div class="msg">Could not load the list. <a href="https://github.com/scottjobagent/jobfairx-prototype" target="_blank">Browse the repo</a>.</div>'; };
  x.send();
})();
</script>
</body>
</html>
