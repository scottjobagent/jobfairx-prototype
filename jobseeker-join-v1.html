<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JobFairX — Joining an interview</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════
   JOINING AN INTERVIEW
   Every screen matched against Scott's own screenshots of the
   real Indeed flow. Copy is verbatim; the brand name is the
   only substitution, which is why this says "recruiter" where
   the rest of our product says employer, and keeps the word
   "lobby" inside the leave-confirmation sentence.
   Mobile is observed. The desktop layout is ours — the
   recording and screenshots are phone-only.
   ═══════════════════════════════════════════════════════════ */
:root{
  --font:'Noto Sans',-apple-system,BlinkMacSystemFont,sans-serif;
  --blue:#0044B3; --blue-hover:#003399; --blue-wash:#eef4ff;
  --ink:#2d2d2d; --ink-2:#595959; --ink-3:#767676; --ink-disabled:#a9a7a4;
  --page:#f3f2ef; --surface:#fff; --border:#d4d2d0; --divider:#ebebeb;
  --tile:#f1f0ee;
  --green-deep:#13674a; --red-solid:#9d2933;
  --t-xs:12px; --t-sm:13px; --t-base:14px; --t-md:16px; --t-lg:17px; --t-xl:20px; --t-2xl:22px;
  --r-sm:6px; --r-md:8px; --r-lg:12px; --r-xl:16px;
  --shadow-menu:0 6px 24px rgba(0,0,0,.18);
  --devbar-h:44px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--page);color:var(--ink);font-size:var(--t-base);line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:3px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}

/* ═══ DEV BAR ═══ */
.devbar{position:fixed;top:0;left:0;right:0;min-height:44px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;padding:6px 16px;z-index:400;flex-wrap:wrap}
.dev-toggle{display:flex;align-items:center;gap:5px;padding:3px 8px;background:var(--page);border-radius:5px;border:1px solid var(--border)}
.dev-toggle-label{font-size:9px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
.dev-toggle-switch{display:flex;background:#e0e0e0;border-radius:3px;overflow:hidden}
.dev-toggle-btn{padding:3px 7px;font-size:10px;font-weight:700;border:none;background:transparent;cursor:pointer;font-family:inherit;color:var(--ink-3);transition:all .15s}
.dev-toggle-btn.active{background:var(--blue);color:#fff}
.dev-toggle-btn:disabled{opacity:.4;cursor:not-allowed}
.devbar-note{margin-left:auto;font-size:var(--t-sm);color:var(--ink-2)}
body.embed .devbar{display:none}

/* ═══ PHONE STAGE ═══ */
#phoneStage{display:none;padding:calc(var(--devbar-h) + 20px) 20px 40px;flex-direction:column;align-items:center;gap:12px}
body.stage-mobile #phoneStage{display:flex}
body.stage-mobile .appwrap{display:none!important}
.phone-shell{width:390px;height:844px;border:10px solid #1c1c1e;border-radius:44px;overflow:hidden;background:#000;box-shadow:0 12px 34px rgba(0,0,0,.18);position:relative;max-width:100%}
.phone-shell iframe{width:390px;height:824px;border:0;display:block;background:var(--surface)}
.phone-notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:150px;height:26px;background:#1c1c1e;border-radius:0 0 16px 16px;z-index:5;pointer-events:none}
.phone-cap{font-size:var(--t-sm);color:var(--ink-3)}

/* ═══ APP CHROME ═══ */
.appwrap{padding-top:var(--devbar-h);min-height:100vh;display:flex;flex-direction:column}
.brandbar{background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:16px;padding:14px 20px;flex-shrink:0}
.brandbar .logo{font-size:26px;font-weight:800;color:var(--blue);letter-spacing:-.6px}
.brandbar .help{width:30px;height:30px;border-radius:50%;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:var(--t-base);color:var(--ink);background:none;cursor:pointer;font-family:inherit;flex-shrink:0}
.brandbar .divider{width:1px;height:34px;background:var(--divider)}
.brandbar .signin{margin-left:auto;border:1px solid var(--border);color:var(--blue);background:var(--surface);border-radius:var(--r-md);padding:11px 18px;font-size:var(--t-md);font-weight:700;font-family:inherit;cursor:pointer;min-height:44px;display:inline-flex;align-items:center;gap:8px}
.stage{flex:1;display:flex;flex-direction:column;background:var(--page)}

/* ═══ WIZARD COLUMN ═══ */
.col{width:100%;max-width:600px;margin:0 auto;padding:20px 16px 60px}
.card{background:var(--surface);border-radius:var(--r-lg);padding:26px 24px}
.stepn{font-size:var(--t-sm);font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--ink-2);margin-bottom:10px}
h1{font-size:25px;font-weight:700;letter-spacing:-.3px;line-height:1.3;margin-bottom:10px}
.lede{font-size:var(--t-md);color:var(--ink-2);line-height:1.6;margin-bottom:20px}
.note{font-size:var(--t-md);line-height:1.6;margin-bottom:22px}
.btn{display:block;width:100%;padding:14px 24px;border-radius:var(--r-md);font-size:var(--t-md);font-weight:700;cursor:pointer;font-family:inherit;border:1px solid transparent;text-align:center;transition:all .15s;min-height:48px}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:hover{background:var(--blue-hover)}
.btn-secondary{background:var(--surface);color:var(--blue);border-color:var(--border);margin-top:12px}
.btn-secondary:hover{background:var(--page)}
.btn-inline{display:inline-flex;align-items:center;justify-content:center;gap:10px;width:auto;padding:14px 26px;margin:0 auto}
.btn .ico{width:22px;height:22px;flex-shrink:0}
.btn-row{display:flex;gap:12px;justify-content:flex-end;margin-top:20px}
.btn-row .btn{margin-top:0;width:auto;padding:12px 22px;min-height:46px}
.foot{text-align:center;font-size:var(--t-sm);color:var(--ink-2);margin-top:20px;line-height:2}
.foot a{color:var(--ink-2);display:inline-block;padding:10px 3px}
.art{display:block;width:150px;height:auto;margin:4px auto 22px}

/* ═══ DEVICE ROWS ═══ */
.dev-row{margin-bottom:20px}
.dev-row .lbl{font-size:var(--t-md);font-weight:700;margin-bottom:8px}
.sel{position:relative}
.sel select{width:100%;padding:13px 40px 13px 14px;border:1px solid var(--border);border-radius:var(--r-md);font-family:inherit;font-size:var(--t-md);background:var(--surface);color:var(--ink);min-height:50px;appearance:none}
.sel .chev{position:absolute;right:14px;top:50%;transform:translateY(-50%);pointer-events:none;width:20px;height:20px;color:var(--ink-2)}
/* Indeed's mic level is a row of short bars, not a continuous meter. */
.meter{display:flex;gap:5px;margin:12px 0 4px;height:16px;align-items:center}
.meter i{width:7px;height:16px;border-radius:3px;background:var(--ink);opacity:.22}
.meter i.on{opacity:1}
.meter-lbl{font-size:var(--t-base);color:var(--ink-2);margin-top:10px}
.check-row{display:flex;align-items:flex-start;gap:12px;margin-top:6px;font-size:var(--t-md);min-height:44px;padding:8px 0}
.check-box{width:22px;height:22px;border-radius:5px;border:2px solid var(--ink-disabled);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;background:var(--surface)}
.check-box.on{background:var(--blue);border-color:var(--blue);color:#fff}
.check-box svg{width:14px;height:14px}
.check-row.off{color:var(--ink-disabled)}
.check-row .why{display:block;font-size:var(--t-base);color:var(--ink-disabled)}
.outline-btn{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);color:var(--blue);font-family:inherit;font-size:var(--t-md);font-weight:700;padding:12px 20px;cursor:pointer;min-height:46px}

/* ═══ SELF VIEW ═══ */
.selfview{background:#2f3336;border-radius:var(--r-lg);aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;margin-bottom:20px;overflow:hidden}
.selfview svg{width:88px;height:88px;color:rgba(255,255,255,.34)}

/* ═══ PHONE FIELD ═══ */
.legal{font-size:var(--t-sm);color:var(--ink-2);line-height:1.6;margin-bottom:14px}
.infoline{display:flex;gap:12px;align-items:flex-start;font-size:var(--t-md);line-height:1.55;margin-bottom:16px}
.infoline svg{width:22px;height:22px;flex-shrink:0;margin-top:1px;color:var(--ink-2)}

/* ═══ JOIN CARD ═══ */
.evtitle{font-size:var(--t-xl);font-weight:700;line-height:1.35;margin-bottom:8px}
.evwhen{font-size:var(--t-md);color:var(--ink-2);margin-bottom:20px}
/* One rounded pill: a green cap on the left, the message on a
   grey field to its right. */
.readybox{display:flex;border-radius:10px;overflow:hidden;margin-bottom:26px;background:var(--page)}
.readybox .cap{background:var(--green-deep);width:56px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.readybox .cap svg{width:24px;height:24px;color:#fff}
.readybox .body{padding:12px 16px;min-width:0}
.readybox b{display:block;font-size:var(--t-md);font-weight:700}
.readybox .sub{display:block;font-size:var(--t-md);color:var(--ink-2);margin-top:2px}
.cdown{display:flex;align-items:center;gap:8px;margin-top:4px;font-size:var(--t-md);font-weight:700}
.cdown svg{width:19px;height:19px;color:var(--ink-2);flex-shrink:0}
.nextlbl{text-align:center;font-size:var(--t-md);font-weight:700;margin-bottom:2px}
.nexttxt{text-align:center;font-size:var(--t-md);color:var(--ink);margin-bottom:22px;line-height:1.55}
.hangup{display:block;width:34px;height:20px;margin:8px auto 10px;color:var(--ink)}
.leftttl{text-align:center;font-size:var(--t-xl);font-weight:700;margin-bottom:4px}

/* ═══ SPLASH ═══ */

/* ═══ ROOM ═══ */
.room{flex:1;display:flex;flex-direction:column;background:var(--surface);position:relative;overflow:hidden}
.roominner{flex:1;padding:14px;display:flex;flex-direction:column;gap:12px;overflow:auto}
/* The waiting message occupies the recruiter's tile rather than a card of its
   own, so when they arrive their video replaces it in the same square instead
   of the message vanishing and a new tile appearing beneath it. */
/* Padding sits on the message, not the tile: with flex-basis 0 on desktop a
   padded tile claims its padding as a floor and the two squares come out
   unequal, which defeats the point of swapping video into the same slot. */
.tile.waittile{text-align:center}
.waitmsg{padding:16px}
.waitmsg b{display:block;font-size:var(--t-lg);font-weight:700;margin-bottom:6px;line-height:1.35}
.waitmsg span{font-size:var(--t-md);color:var(--ink-2);line-height:1.5}
.tiles{display:flex;flex-direction:column;gap:12px}
.tile{background:var(--tile);border-radius:10px;position:relative;aspect-ratio:16/11;display:flex;align-items:center;justify-content:center;overflow:hidden}
.tile .vid{background:#8d7f6d;width:64%;height:100%;display:flex;align-items:center;justify-content:center}
.tile .vid svg{width:60px;height:60px;color:rgba(255,255,255,.5)}
.namechip{background:var(--surface);border-radius:8px;padding:7px 12px;display:inline-flex;align-items:center;gap:8px;font-size:var(--t-md);max-width:calc(100% - 20px)}
.namechip.tl{position:absolute;top:10px;left:10px}
.namechip svg{width:17px;height:17px;flex-shrink:0;color:var(--ink-2)}
.bars{display:inline-flex;align-items:flex-end;gap:2px;height:14px}
.bars i{width:3px;background:var(--ink-3);border-radius:1px}
.bars i:nth-child(1){height:5px}.bars i:nth-child(2){height:9px}.bars i:nth-child(3){height:14px}
.bars.live i{background:var(--blue)}

/* ═══ CONTROL BAR ═══ */
.ctrls{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 18px 16px;background:var(--surface);flex-shrink:0}
.cbtn{width:56px;height:46px;border-radius:10px;border:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);flex-shrink:0}
.cbtn svg{width:24px;height:24px}
.cbtn.plain{border-color:transparent;width:48px}
.cbtn.leave{background:var(--red-solid);border-color:var(--red-solid);color:#fff}

/* ═══ THE ⋯ MENU ═══ */
.omenu{position:absolute;left:14px;bottom:74px;background:var(--surface);border-radius:12px;box-shadow:var(--shadow-menu);z-index:30;min-width:266px;padding:4px 0;overflow:hidden}
.oitem{display:flex;align-items:flex-start;gap:14px;width:100%;padding:15px 18px;background:none;border:none;font-family:inherit;font-size:var(--t-md);color:var(--ink);text-align:left;cursor:pointer;min-height:52px}
.oitem:hover{background:var(--page)}
.oitem svg{width:22px;height:22px;flex-shrink:0;margin-top:1px;color:var(--ink)}
.oitem.off{color:var(--ink-disabled);cursor:not-allowed}
.oitem.off svg{color:var(--ink-disabled)}
.oitem .why{display:block;font-size:var(--t-base);color:var(--ink-disabled)}
.osep{height:1px;background:var(--divider);margin:0 18px}

/* ═══ SHEETS AND MODALS ═══ */
.sheet{position:absolute;left:0;right:0;top:0;bottom:78px;background:var(--surface);display:flex;flex-direction:column;z-index:25}
.sheet-h{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--divider);flex-shrink:0}
.sheet-h b{font-size:var(--t-xl);font-weight:500;flex:1}
.sheet-h>svg{width:24px;height:24px;color:var(--ink)}
.sheet-x{width:44px;height:44px;border:none;background:none;cursor:pointer;color:var(--ink);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sheet-x svg{width:22px;height:22px}
.infobar{display:flex;gap:12px;align-items:center;background:var(--page);padding:13px 16px;font-size:var(--t-md);color:var(--ink-2)}
.infobar svg{width:20px;height:20px;flex-shrink:0;color:var(--ink-3)}
.sheet-b{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;justify-content:flex-end}
.chat-empty{background:var(--blue-wash);border-radius:10px;padding:16px;display:flex;gap:12px;align-items:flex-start}
.chat-empty svg{width:22px;height:22px;flex-shrink:0;color:var(--ink-2);margin-top:1px}
.chat-empty b{display:block;font-size:var(--t-md);font-weight:700;margin-bottom:2px}
.chat-empty span{font-size:var(--t-md);color:var(--ink-2);line-height:1.45}
.composer{padding:12px 16px;display:flex;gap:12px;align-items:flex-end;flex-shrink:0}
.composer textarea{flex:1;min-width:0;min-height:72px;padding:12px 14px;border:1px solid var(--ink-3);border-radius:10px;font-family:inherit;font-size:var(--t-md);resize:none}
.send{width:52px;height:46px;border-radius:10px;border:none;background:#9fb8e8;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.send svg{width:24px;height:24px}

.ov{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:40;display:flex;align-items:center;justify-content:center;padding:18px}
.modal{background:var(--surface);border-radius:14px;width:420px;max-width:100%;max-height:100%;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.modal-h{display:flex;align-items:center;gap:12px;padding:18px 18px 14px}
.modal-h b{font-size:var(--t-xl);font-weight:700;flex:1}
.modal-h>svg{width:24px;height:24px;color:var(--ink)}
.modal-b{padding:0 18px 18px}
.tabs{display:flex;border-bottom:1px solid var(--divider);margin:0 0 18px}
.tabs button{flex:1;padding:12px 8px;border:none;background:none;font-family:inherit;font-size:var(--t-md);font-weight:600;color:var(--ink-3);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;min-height:48px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:700}
.modal.center{text-align:center}
.modal.center .modal-b{padding:0 22px 20px}
.modal.center h3{font-size:var(--t-xl);font-weight:700;margin-bottom:8px}
.modal.center p{font-size:var(--t-md);color:var(--ink-2);line-height:1.55;margin-bottom:10px}
.modal.center .num{font-size:var(--t-xl);font-weight:700;color:var(--ink);margin-bottom:12px}
.xrow{display:flex;justify-content:flex-end;padding:14px 14px 0}
.xbtn{width:44px;height:44px;border:none;background:none;cursor:pointer;color:var(--ink);display:flex;align-items:center;justify-content:center}
.xbtn svg{width:22px;height:22px}
.btn-danger{background:var(--red-solid);color:#fff}
.phone-art{display:block;width:170px;height:auto;margin:0 auto 14px}

/* ═══ SURVEY ═══ */
.q{margin-bottom:26px}
.q .qt{font-size:var(--t-md);font-weight:700;margin-bottom:14px;line-height:1.45}
.thumbs{display:flex;gap:44px;padding-left:4px}
/* Indeed's thumbs are bare icons, not boxed controls. */
.thumb{border:none;background:none;padding:10px 12px;cursor:pointer;color:var(--ink);display:flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;border-radius:var(--r-md)}
.thumb svg{width:26px;height:26px}
.thumb.sel{color:var(--blue);background:var(--blue-wash)}
.ta{width:100%;min-height:120px;padding:13px 14px;border:1px solid var(--ink-3);border-radius:10px;font-family:inherit;font-size:var(--t-md);margin-top:4px;resize:vertical}

/* ═══ DESKTOP — ours, not observed ═══ */
@media (min-width:901px){
  .col{padding:36px 20px 80px}
  .card{padding:34px 38px;border:1px solid var(--border)}
  .room{padding:22px}
  .roominner{max-width:880px;margin:0 auto;width:100%;padding:0 0 16px}
  .tiles{flex-direction:row;flex-wrap:wrap}
  .tiles .tile{flex:1 1 0;min-width:300px;aspect-ratio:16/10}
  .ctrls{justify-content:center;gap:16px;max-width:880px;margin:0 auto;width:100%;border:1px solid var(--divider);border-radius:var(--r-lg)}
  .sheet{left:auto;right:22px;top:22px;bottom:100px;width:400px;border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-menu)}
  .omenu{left:50%;transform:translateX(-330px);bottom:90px}
  .selfview{aspect-ratio:16/10}
}
@media (max-width:900px){
  .brandbar{padding:12px 16px}
  .col{padding:14px 12px 50px}
  .card{padding:20px 18px}
  h1{font-size:23px}
  .btn-row{justify-content:stretch}
  .btn-row .btn{flex:1}
}
</style>
</head>
<body>

<div class="devbar" role="region" aria-label="Prototype state controls">
  <div class="dev-toggle" id="tgView">
    <span class="dev-toggle-label">View:</span>
    <div class="dev-toggle-switch">
      <button class="dev-toggle-btn active" onclick="setView('desktop',this)">Desktop</button>
      <button class="dev-toggle-btn" onclick="setView('mobile',this)">Mobile</button>
    </div>
  </div>
  <div class="dev-toggle">
    <span class="dev-toggle-label">Screen:</span>
    <div class="dev-toggle-switch" id="tgScreen">
      <button class="dev-toggle-btn active" onclick="go('check')">Test</button>
      <button class="dev-toggle-btn" onclick="go('permission')">Permission</button>
      <button class="dev-toggle-btn" onclick="go('preview')">Self-view</button>
      <button class="dev-toggle-btn" onclick="go('devices')">Devices</button>
      <button class="dev-toggle-btn" onclick="go('join')">Join</button>
      <button class="dev-toggle-btn" onclick="go('waiting')">Waiting</button>
      <button class="dev-toggle-btn" onclick="go('inroom')">In room</button>
      <button class="dev-toggle-btn" onclick="go('survey')">Survey</button>
      <button class="dev-toggle-btn" onclick="go('left')">Left</button>
    </div>
  </div>
  <div class="dev-toggle">
    <span class="dev-toggle-label">Overlay:</span>
    <div class="dev-toggle-switch" id="tgOverlay">
      <button class="dev-toggle-btn active" onclick="setOverlay('none')">None</button>
      <button class="dev-toggle-btn" onclick="setOverlay('menu')">⋯ menu</button>
      <button class="dev-toggle-btn" onclick="setOverlay('chat')">Chat</button>
      <button class="dev-toggle-btn" onclick="setOverlay('settings')">Settings</button>
      <button class="dev-toggle-btn" onclick="setOverlay('byphone')">Use phone</button>
      <button class="dev-toggle-btn" onclick="setOverlay('leave')">Leave</button>
    </div>
  </div>
  <div class="dev-toggle">
    <span class="dev-toggle-label">Camera:</span>
    <div class="dev-toggle-switch" id="tgCam">
      <button class="dev-toggle-btn active" onclick="setCam(false)">On</button>
      <button class="dev-toggle-btn" onclick="setCam(true)">Off</button>
    </div>
  </div>
  <div class="devbar-note">Joining an interview</div>
</div>

<div id="phoneStage">
  <div class="phone-shell"><div class="phone-notch"></div>
    <iframe id="phoneFrame" title="Joining an interview at phone size"></iframe>
  </div>

</div>

  warn:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l9.5 17H2.5L12 3z"/><path d="M12 10v4M12 17h.01"/></svg>',
  sms:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>',
  info:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>',
  gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 00.3 1.9l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.9-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1A1.7 1.7 0 007.9 19a1.7 1.7 0 00-1.9.4l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.9 1.7 1.7 0 00-1.5-1H2a2 2 0 110-4h.1A1.7 1.7 0 003.6 8a1.7 1.7 0 00-.4-1.9l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.9.3H8a1.7 1.7 0 001-1.5V2a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.9-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.9V8a1.7 1.7 0 001.5 1H22a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>',
  tel:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 10.8a15.1 15.1 0 006.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.2.4 2.4.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 013 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.4 0 .8-.2 1l-2.3 2.2z"/></svg>',
  share:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M12 8v5M9.5 10.5L12 8l2.5 2.5"/></svg>',
  eyeOff:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.9 17.9A9.7 9.7 0 0112 20c-7 0-11-8-11-8a18 18 0 015.1-5.9M9.9 4.2A9.7 9.7 0 0112 4c7 0 11 8 11 8a18 18 0 01-2.2 3.2M1 1l22 22"/></svg>',
  flag:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 22V4M4 4h13l-2.5 4L17 12H4"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  chev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>',
  send:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 20l19-8L3 4l4 8-4 8z"/></svg>',
  hangup:'<svg viewBox="0 0 34 20" fill="currentColor"><path d="M17 1C10.6 1 4.8 3.2.9 6.8a2 2 0 000 2.9l2.4 2.3c.7.7 1.9.8 2.7.2l3-2.2c.5-.4.8-1 .8-1.6V5.9a20 20 0 0114.4 0v2.5c0 .6.3 1.2.8 1.6l3 2.2c.8.6 2 .5 2.7-.2l2.4-2.3a2 2 0 000-2.9C29.2 3.2 23.4 1 17 1z"/></svg>',
  up:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M2 10h4v11H2a1 1 0 01-1-1V11a1 1 0 011-1zm6 0l5-8.5A2.2 2.2 0 0116 3.6L14.8 9h5.4a2.2 2.2 0 012.1 2.8l-2.1 7.6A2.2 2.2 0 0118 21H8V10z"/></svg>',
  down:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M22 14h-4V3h4a1 1 0 011 1v9a1 1 0 01-1 1zm-6 0l-5 8.5A2.2 2.2 0 018 20.4L9.2 15H3.8a2.2 2.2 0 01-2.1-2.8l2.1-7.6A2.2 2.2 0 016 3h10v11z"/></svg>'
};
function bars(live){ return '<span class="bars' + (live ? ' live' : '') + '"><i></i><i></i><i></i></span>'; }

/* ═══ MODEL ═══
   Names and the phone number are prototype placeholders — the
   real ones in the screenshots belong to actual people. */
var EVENT = { name:'Dallas Healthcare Hiring Event - April 22, 2026 Registered Nurse',
              when:'Apr 22, 2026 at 11:00 AM - 3:00 PM CT' };
var ME = 'Jordan Reyes';
var RECRUITER = 'Alicia Barrett';
var TEL = '+1 555 014 2278';
var ORIGIN = 'interviews.jobfairx.com';
var HOLD = 5 * 60;

var S = { screen:'check', overlay:'none', camOff:false, micOff:false, selfHidden:false, tab:'audio', rating:{} };

/* ═══ COUNTDOWN ═══ */
var left = HOLD, timer = null;
function cdText(s){
  if(s < 0) s = 0;
  var m = Math.floor(s/60), sec = s % 60;
  return m + (m===1?' minute, ':' minutes, ') + sec + (sec===1?' second':' seconds');
}
function startClock(){
  stopClock(); left = HOLD;
  timer = setInterval(function(){
    left--;
    var el = document.getElementById('cdown');
    if(!el){ stopClock(); return; }
    el.textContent = cdText(left);
    /* Zero was never captured, so nothing is invented — it stops. */
    if(left <= 0) stopClock();
  }, 1000);
}
function stopClock(){ if(timer){ clearInterval(timer); timer = null; } }

/* ═══ SCREENS ═══ */
function scCheck(){
  return '<div class="col"><div class="card">'
   + '<div class="stepn">Step 1 of 2</div>'
   + '<h1>Test audio and video connection</h1>'
   + '<p class="lede">Checking your connection helps ensure a smooth interview experience.</p>'
   + '<svg class="art" viewBox="0 0 150 120" fill="none" aria-hidden="true">'
   +   '<rect x="46" y="10" width="58" height="100" rx="10" fill="#fff" stroke="#d4d2d0" stroke-width="2"/>'
   +   '<rect x="55" y="26" width="40" height="30" rx="5" fill="#eef4ff"/>'
   +   '<path d="M68 41h14M75 34v14" stroke="#0044B3" stroke-width="2.5" stroke-linecap="round"/>'
   +   '<rect x="55" y="64" width="40" height="9" rx="4" fill="#ebebeb"/>'
   +   '<rect x="55" y="79" width="26" height="9" rx="4" fill="#ebebeb"/>'
   +   '<circle cx="112" cy="86" r="17" fill="#e2f0e8"/>'
   +   '<path d="M105 86l5 5 10-10" stroke="#13674a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>'
   + '</svg>'
   + '<p class="note">You’ll need to allow access to your mic and camera</p>'
   + '<button class="btn btn-primary" onclick="go(\'permission\')">Test now</button>'
   + '</div><p class="foot"><a href="#" onclick="return false">Do Not Sell My Personal Information</a></p></div>';
}
function scPermission(){
  return scCheck()
   + '<div class="ov" style="position:fixed;z-index:600"><div class="modal center" style="width:330px">'
   + '<div class="modal-b" style="padding:24px 22px 18px">'
   + '<p style="color:var(--ink);margin-bottom:20px">Allow &ldquo;' + ORIGIN + '&rdquo; to use your camera and microphone?</p>'
   + '<button class="btn btn-secondary" style="margin-top:0" onclick="go(\'check\')">Don’t Allow</button>'
   + '<button class="btn btn-primary" style="margin-top:10px" onclick="go(\'preview\')">Allow</button>'
   + '</div></div></div>';
}
function scPreview(){
  return '<div class="col"><div class="card">'
   + '<div class="selfview">' + I.person + '</div>'
   + '<button class="btn btn-primary" onclick="go(\'devices\')">Continue</button>'
   + '</div></div>';
}
function meter(n){
  var h = '<div class="meter" aria-hidden="true">';
  for(var i=0;i<7;i++) h += '<i class="' + (i<n?'on':'') + '"></i>';
  return h + '</div>';
}
function selectRow(label, value, extra){
  return '<div class="dev-row"><div class="lbl">' + label + '</div>'
   + '<div class="sel"><select aria-label="' + label + '"><option>' + value + '</option></select>'
   + '<span class="chev">' + I.chev + '</span></div>' + (extra || '') + '</div>';
}
function scDevices(){
  return '<div class="col"><div class="card">'
   + '<div class="selfview">' + I.person + '</div>'
   + selectRow('Microphone', 'iPhone Microphone', '<div class="meter-lbl">Microphone Input:</div>' + meter(5))
   + selectRow('Speaker', 'Default - Speaker', '<div style="margin-top:12px"><button class="outline-btn" onclick="toast(\'Test speaker\')">Test speaker</button></div>')
   + selectRow('Camera', 'Front Ultra Wide Camera',
       '<label class="check-row"><span class="check-box on">' + I.tick + '</span>Mirror my video</label>')
   + '<button class="btn btn-primary" onclick="go(\'join\')">Continue</button>'
   + '</div><p class="foot"><a href="#" onclick="return false">Do Not Sell My Personal Information</a></p></div>';
}
function readybox(withCountdown){
  var h = '<div class="readybox"><div class="cap">' + I.tick + '</div><div class="body">'
   + '<b>You can now join the interview</b>';
  if(withCountdown){
    h += '<span class="sub">Join before losing your spot in:</span>'
      +  '<div class="cdown">' + I.clock + '<span id="cdown">' + cdText(left) + '</span></div>';
  }
  return h + '</div></div>';
}
function scJoin(){
  return '<div class="col"><div class="card">'
   + '<div class="evtitle">' + EVENT.name + '</div>'
   + '<div class="evwhen">' + EVENT.when + '</div>'
   + readybox(true)
   + '<div class="nextlbl">Next:</div>'
   + '<div class="nexttxt">Join the interview and wait for the interviewer.</div>'
   + '<button class="btn btn-primary btn-inline" onclick="go(\'waiting\')"><span class="ico">' + I.cam + '</span>Join your interview</button>'
   + '</div><p class="foot"><a href="#" onclick="return false">Do Not Sell My Personal Information</a> - <a href="#" onclick="return false">Report</a> - <a href="#" onclick="return false">Help</a></p></div>';
}
function scLeft(){
  return '<div class="col"><div class="card">'
   + '<div class="evtitle">' + EVENT.name + '</div>'
   + '<div class="evwhen">' + EVENT.when + '</div>'
   + readybox(false)
   + '<span class="hangup">' + I.hangup + '</span>'
   + '<div class="leftttl">You left the interview</div>'
   + '<div class="nexttxt">You can rejoin until the employer ends the interview.</div>'
   + '<button class="btn btn-primary btn-inline" onclick="go(\'join\')"><span class="ico">' + I.cam + '</span>Rejoin your interview</button>'
   + '</div><p class="foot"><a href="#" onclick="return false">Do Not Sell My Personal Information</a> - <a href="#" onclick="return false">Report</a> - <a href="#" onclick="return false">Help</a></p></div>';
}

/* ═══ ROOM ═══ */
function tile(name, showVideo, live){
  var chip = '<span class="namechip' + (showVideo ? ' tl' : '') + '">' + I.mic + bars(live) + name + '</span>';
  if(showVideo) return '<div class="tile"><div class="vid">' + I.person + '</div>' + chip + '</div>';
  return '<div class="tile">' + chip + '</div>';
}
function room(waiting){
  var h = '<div class="room"><div class="roominner"><div class="tiles">';
  /* The recruiter's square comes first in both states — it is the same slot
     whether it is holding the waiting message or their video. */
  h += waiting
    ? '<div class="tile waittile"><div class="waitmsg">'
      + '<b>We’ve let the recruiter know you’re waiting</b>'
      + '<span>Thank you for your patience. The recruiter will be with you shortly.</span></div></div>'
    : tile(RECRUITER, true, false);
  h += tile(ME + ' (You)', !S.camOff && !S.selfHidden, !S.micOff);
  h += '</div></div>';
  h += '<div class="ctrls">'
     + '<button class="cbtn plain" aria-label="More options" onclick="setOverlay(\'menu\')">' + I.dots + '</button>'
     + '<button class="cbtn" aria-label="Microphone" onclick="tgl(\'micOff\')">' + I.mic + '</button>'
     + '<button class="cbtn" aria-label="Camera" onclick="tgl(\'camOff\')">' + (S.camOff ? I.camOff : I.cam) + '</button>'
     + '<button class="cbtn leave" aria-label="Leave interview" onclick="setOverlay(\'leave\')">' + I.leave + '</button>'
     + '<button class="cbtn plain" aria-label="Chat" onclick="setOverlay(\'chat\')">' + I.chat + '</button>'
     + '</div>';
  return h + overlay() + '</div>';
}

function overlay(){
  var o = S.overlay;
  if(o === 'menu'){
    return '<div class="omenu" role="menu">'
     + '<button class="oitem" role="menuitem" onclick="setOverlay(\'settings\')">' + I.gear + '<span>Audio &amp; video settings</span></button>'
     + '<div class="osep"></div>'
     + '<button class="oitem" role="menuitem" onclick="setOverlay(\'byphone\')">' + I.tel + '<span>Use phone</span></button>'
     + '<span class="oitem off">' + I.share + '<span>Share screen<span class="why">Not available in mobile</span></span></span>'
     + '<div class="osep"></div>'
     + '<button class="oitem" role="menuitem" onclick="tgl(\'selfHidden\')">' + I.eyeOff + '<span>' + (S.selfHidden ? 'Show self-view' : 'Hide self-view') + '</span></button>'
     + '<button class="oitem" role="menuitem" onclick="toast(\'Report\')">' + I.flag + '<span>Report</span></button>'
     + '</div>';
  }
  if(o === 'chat'){
    return '<div class="sheet">'
     + '<div class="sheet-h">' + I.chat + '<b>Chat</b>'
     +   '<button class="sheet-x" aria-label="Close chat" onclick="setOverlay(\'none\')">' + I.x + '</button></div>'
     + '<div class="infobar">' + I.info + '<span>Chat history will not be saved.</span></div>'
     + '<div class="sheet-b"><div class="chat-empty">' + I.personSm
     +   '<span><b>You\'re the only one here.</b><span>Your messages won\'t be seen until someone else joins.</span></span></div></div>'
     + '<div class="composer"><textarea aria-label="Message"></textarea>'
     +   '<button class="send" aria-label="Send">' + I.send + '</button></div>'
     + '</div>';
  }
  if(o === 'settings'){
    var audio = S.tab === 'audio', h;
    h = '<div class="ov"><div class="modal">'
     + '<div class="modal-h">' + I.gear + '<b>Audio &amp; video settings</b>'
     +   '<button class="xbtn" aria-label="Close settings" onclick="setOverlay(\'none\')">' + I.x + '</button></div>'
     + '<div class="tabs" role="tablist">'
     +   '<button role="tab" aria-selected="' + audio + '" onclick="setTab(\'audio\')">Audio</button>'
     +   '<button role="tab" aria-selected="' + (!audio) + '" onclick="setTab(\'video\')">Video</button></div>'
     + '<div class="modal-b">';
    if(audio){
      h += selectRow('Microphone', 'iPhone Microphone', meter(7)
        + '<label class="check-row off"><span class="check-box"></span>'
        + '<span>Suppress background noise<span class="why">Not available in mobile</span></span></label>')
        + selectRow('Speaker', 'Default - Speaker',
            '<div style="margin-top:12px"><button class="outline-btn" onclick="toast(\'Test speaker\')">Test speaker</button></div>');
    } else {
      /* Never opened on the recording, so nothing is invented for it. */
      h += '<p class="lede">Not captured on the recording.</p>';
    }
    return h + '</div></div></div>';
  }
  if(o === 'byphone'){
    return '<div class="ov"><div class="modal center">'
     + '<div class="xrow"><button class="xbtn" aria-label="Close" onclick="setOverlay(\'none\')">' + I.x + '</button></div>'
     + '<div class="modal-b">'
     + '<svg class="phone-art" viewBox="0 0 170 120" fill="none" aria-hidden="true">'
     +   '<path d="M14 96l44-26 60 10-30 34z" fill="#e7d3b8"/>'
     +   '<rect x="62" y="18" width="44" height="76" rx="7" fill="#2f3f57"/>'
     +   '<rect x="67" y="25" width="34" height="60" rx="4" fill="#fff"/>'
     +   '<rect x="72" y="20" width="24" height="12" rx="3" fill="#9fb8e8"/>'
     +   '<path d="M96 92c8 6 18 10 26 10l6-10-16-8-8 4z" fill="#f0c9a8"/>'
     +   '<path d="M48 96c-8 6-14 12-14 18h30l6-14-10-6z" fill="#f0c9a8"/>'
     + '</svg>'
     + '<h3>Join by phone</h3>'
     + '<p>We’ll call you at this number</p>'
     + '<div class="num">' + TEL + '</div>'
     + '<p>You will be connected to the interview room by phone. You and the employer will no longer be able to see each other.</p>'
     + '<div class="btn-row"><button class="btn btn-secondary" style="margin:0" onclick="setOverlay(\'none\')">Cancel</button>'
     +   '<button class="btn btn-primary" onclick="toast(\'Calling you now\')">Call me</button></div>'
     + '</div></div></div>';
  }
  if(o === 'leave'){
    return '<div class="ov"><div class="modal center">'
     + '<div class="xrow"><button class="xbtn" aria-label="Close" onclick="setOverlay(\'none\')">' + I.x + '</button></div>'
     + '<div class="modal-b">'
     + '<h3>Are you sure you want to leave the interview?</h3>'
     + '<p>You can rejoin the interview by clicking on &ldquo;join interview room&rdquo; from the interview lobby</p>'
     + '<div class="btn-row"><button class="btn btn-secondary" style="margin:0" onclick="setOverlay(\'none\')">Cancel</button>'
     +   '<button class="btn btn-danger" onclick="setOverlay(\'none\');go(\'survey\')">Leave Call</button></div>'
     + '</div></div></div>';
  }
  return '';
}

/* ═══ SURVEY ═══ */
function q(id, text){
  var v = S.rating[id];
  return '<div class="q"><div class="qt">' + text + '</div><div class="thumbs">'
   + '<button class="thumb' + (v==='up'?' sel':'') + '" aria-label="Yes" onclick="rate(\'' + id + '\',\'up\')">' + I.up + '</button>'
   + '<button class="thumb' + (v==='down'?' sel':'') + '" aria-label="No" onclick="rate(\'' + id + '\',\'down\')">' + I.down + '</button>'
   + '</div></div>';
}
function scSurvey(){
  return '<div class="col"><div class="card">'
   + '<h1>How would you rate these?</h1>'
   + '<p class="lede">Your answer will only be visible to JobFairX.</p>'
   + q('worth','Was the experience worth your time?')
   + q('wait','How was the wait time?')
   + q('interviewer','How was the interviewer?')
   + q('quality','How was the call quality?')
   + '<div class="q"><div class="qt">What could be improved?</div>'
   +   '<textarea class="ta" aria-label="What could be improved?"></textarea></div>'
   + '<button class="btn btn-primary" onclick="go(\'left\')">Submit</button>'
   + '<button class="btn btn-secondary" onclick="go(\'left\')">Skip</button>'
   + '</div></div>';
}

/* ═══ RENDER ═══ */
function render(){
  var s = S.screen, h = '';
  if(s === 'check') h = scCheck();
  else if(s === 'permission') h = scPermission();
  else if(s === 'preview') h = scPreview();
  else if(s === 'devices') h = scDevices();
  else if(s === 'join') h = scJoin();
  else if(s === 'waiting') h = room(true);
  else if(s === 'inroom') h = room(false);
  else if(s === 'survey') h = scSurvey();
  else h = scLeft();
  document.getElementById('stage').innerHTML = h;
  var hideBrand = (s==='waiting' || s==='inroom' || s==='loading' || s==='survey');
  document.getElementById('brandbar').style.display = hideBrand ? 'none' : '';
  if(s === 'join') startClock(); else stopClock();
  syncToggles();
}
function syncToggles(){
  var order = ['check','permission','preview','devices','phone','join','loading','waiting','inroom','survey','left'];
  document.querySelectorAll('#tgScreen .dev-toggle-btn').forEach(function(b,i){
    b.classList.toggle('active', order[i] === S.screen);
  });
  var ov = ['none','menu','chat','settings','byphone','leave'];
  var roomy = (S.screen === 'waiting' || S.screen === 'inroom');
  document.querySelectorAll('#tgOverlay .dev-toggle-btn').forEach(function(b,i){
    b.classList.toggle('active', ov[i] === S.overlay);
    b.disabled = !roomy && i > 0;
  });
  document.querySelectorAll('#tgCam .dev-toggle-btn').forEach(function(b,i){
    b.classList.toggle('active', (i===1) === S.camOff);
  });
}
function go(v){ S.screen = v; if(v!=='waiting' && v!=='inroom') S.overlay = 'none'; render(); push(); window.scrollTo(0,0); }
function setOverlay(v){ S.overlay = v; render(); push(); }
function setTab(v){ S.tab = v; render(); push(); }
function setCam(v){ S.camOff = v; render(); push(); }
function tgl(k){ S[k] = !S[k]; if(k==='selfHidden') S.overlay='none'; render(); push(); }
function rate(id,v){ S.rating[id] = (S.rating[id]===v) ? null : v; render(); push(); }

var tTimer;
function toast(m){
  var d = document.createElement('div');
  d.textContent = m; d.setAttribute('role','status');
  d.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:#dcfce7;border:1px solid #bbf7d0;color:#14532d;padding:12px 18px;border-radius:8px;font-weight:600;font-size:14px;z-index:9999';
  document.body.appendChild(d);
  clearTimeout(tTimer); tTimer = setTimeout(function(){ d.remove(); }, 2000);
}

/* ═══ PHONE BRIDGE ═══ */
var EMBED = /[?&]m=1/.test(location.search);
function applyState(st){ S = JSON.parse(JSON.stringify(st)); render(); }
function push(){
  if(EMBED || !document.body.classList.contains('stage-mobile')) return;
  var f = document.getElementById('phoneFrame');
  try{ var w = f && f.contentWindow;
    if(w && typeof w.applyState === 'function') w.applyState(S);
  }catch(e){}
}
function setView(v, btn){
  document.querySelectorAll('#tgView .dev-toggle-btn').forEach(function(b){ b.classList.remove('active'); });
  if(btn) btn.classList.add('active');
  var mob = v === 'mobile';
  document.body.classList.toggle('stage-mobile', mob);
  if(mob){
    var f = document.getElementById('phoneFrame');
    if(!f.getAttribute('src')){ f.addEventListener('load', push); f.setAttribute('src', location.pathname + '?m=1'); }
    else push();
  }
  window.scrollTo(0,0);
}
if(EMBED) document.body.classList.add('embed');
function fitDevbar(){
  var d = document.querySelector('.devbar');
  if(d) document.documentElement.style.setProperty('--devbar-h', d.offsetHeight + 'px');
}
window.addEventListener('resize', fitDevbar);
window.addEventListener('load', fitDevbar);
if(window.ResizeObserver){ new ResizeObserver(fitDevbar).observe(document.querySelector('.devbar')); }
fitDevbar();
render();
</script>
</body>
</html>
