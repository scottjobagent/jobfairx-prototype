<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interview Room - JobFairX</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Noto Sans', -apple-system, BlinkMacSystemFont, sans-serif; background: #fff; -webkit-font-smoothing: antialiased; }
.page-loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; transition: opacity 0.3s ease; }
.page-loader.fade-out { opacity: 0; pointer-events: none; }
.page-loader-spinner { width: 44px; height: 44px; border: 4px solid #e5e7eb; border-top-color: #0044B3; border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.page-loader-text { margin-top: 16px; font-size: 16px; font-weight: 500; color: #595959; }
.loaded { display: none; flex-direction: column; align-items: center; justify-content: center; height: 100vh; text-align: center; }
.loaded.visible { display: flex; }
.loaded svg { width: 56px; height: 56px; color: #16a34a; margin-bottom: 16px; }
.loaded h2 { font-size: 22px; font-weight: 700; color: #2d2d2d; margin-bottom: 8px; }
.loaded p { font-size: 15px; color: #595959; margin-bottom: 24px; }
.loaded a { font-size: 14px; color: #0044B3; font-weight: 600; text-decoration: none; }
.loaded a:hover { text-decoration: underline; }
.iv-agent .iv-rays{transform-box:view-box;transform-origin:110px 106px;animation:ivRays 12s linear infinite}
.iv-agent .iv-body{transform-box:fill-box;transform-origin:center;animation:ivBody 3s linear infinite}
.iv-agent .iv-dot1{animation:ivDot 1.4s infinite}
.iv-agent .iv-dot2{animation:ivDot 1.4s infinite .18s}
.iv-agent .iv-dot3{animation:ivDot 1.4s infinite .36s}
.iv-agent .iv-rays,.iv-agent .iv-body,.iv-agent .iv-dot1,.iv-agent .iv-dot2,.iv-agent .iv-dot3{animation:none}
@keyframes ivRays { 0%{transform:rotate(0deg) scale(.78)} 50%{transform:rotate(180deg) scale(1)} 100%{transform:rotate(360deg) scale(.78)} }
@keyframes ivBody { 0%,15%{transform:scale(1,1) translate(0,0)} 20%,35%{transform:scaleX(.99) translate(-1px,1px)} 50%,65%{transform:scale(1,1) translate(0,1px)} 70%,85%{transform:scaleX(.99) translate(1px,1px)} 100%{transform:scale(1,1) translate(0,0)} }
@keyframes ivDot { 0%,60%,100%{opacity:.25} 20%{opacity:1} }
.loader-dots{display:flex;gap:6px;justify-content:center;margin:16px 0 4px}
.loader-dots span{width:7px;height:7px;border-radius:50%;background:#0044B3;animation:ivDot 1.4s ease infinite}
.loader-dots span:nth-child(2){animation-delay:.18s}
.loader-dots span:nth-child(3){animation-delay:.36s}
.page-loader-sub{font-size:13px;color:#767676;margin-top:6px}
</style>
</head>
<body>

<div class="page-loader" id="pageLoader">
  <svg class="iv-agent" width="130" height="130" viewBox="0 0 220 220" fill="none" aria-hidden="true"><g class="iv-rays"><g id="ovSpike"><path d="M110 16 L112.6 48 L110 55 L107.4 48 Z" fill="#0044B3" opacity="0.45"/></g><use href="#ovSpike" transform="rotate(32.7 110 106)"/><use href="#ovSpike" transform="rotate(65.5 110 106)"/><use href="#ovSpike" transform="rotate(98.2 110 106)"/><use href="#ovSpike" transform="rotate(130.9 110 106)"/><use href="#ovSpike" transform="rotate(163.6 110 106)"/><use href="#ovSpike" transform="rotate(196.4 110 106)"/><use href="#ovSpike" transform="rotate(229.1 110 106)"/><use href="#ovSpike" transform="rotate(261.8 110 106)"/><use href="#ovSpike" transform="rotate(294.5 110 106)"/><use href="#ovSpike" transform="rotate(327.3 110 106)"/></g><ellipse cx="110" cy="164" rx="30" ry="6" fill="#18181B" opacity="0.10"/><g class="iv-body"><path d="M110 66 C87.9 66 70 83.9 70 106 C70 126 90 140 106.5 151 C108.6 152.4 111.4 152.4 113.5 151 C130 140 150 126 150 106 C150 83.9 132.1 66 110 66 Z" fill="#2d2d2d"/><circle cx="110" cy="104" r="27" fill="#fff"/><circle cx="101" cy="100" r="3.6" fill="#2d2d2d"/><circle cx="119" cy="100" r="3.6" fill="#2d2d2d"/><path d="M100 109 Q110 119 120 109" stroke="#2d2d2d" stroke-width="3.6" fill="none" stroke-linecap="round"/></g></svg>
<div class="loader-dots"><span></span><span></span><span></span></div>
  <div class="page-loader-text">Opening your interview room...</div><div class="page-loader-sub">Getting your interview room ready</div>
</div>

<div class="loaded" id="loadedState">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
  <h2>Interview room ready</h2>
  <p>Taking you to your interview room...</p>
  <a href="lobby-v3.html">Go to interview room</a>
</div>

<script>
setTimeout(function() {
  var loader = document.getElementById('pageLoader');
  loader.classList.add('fade-out');
  setTimeout(function() {
    loader.style.display = 'none';
    document.getElementById('loadedState').classList.add('visible');
  }, 300);
}, 3000);
</script>

</body>
</html>
