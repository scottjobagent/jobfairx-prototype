<svg xmlns="http://www.w3.org/2000/svg" width="2160" height="1080" viewBox="0 0 2160 1080">
  <title>JobFairX Eventbrite cover (shared, all five event types)</title>
  <desc>Editable source. Export: open in Chrome at 2160x1080 and screenshot (command in hubspot-assets/README.md). Fonts: Inter 800 (labels), Inter 900 (headline). Square-crop safe zone: x 540 to 1620.</desc>
  <style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@800;900&amp;display=swap');</style>
  <defs>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M 72 0 L 0 0 0 72" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>
    </pattern>
  </defs>

  <!-- background: brand blue + subtle grid -->
  <rect id="background" width="2160" height="1080" fill="#0044B3"/>
  <rect id="grid-texture" width="2160" height="1080" fill="url(#grid)"/>
  <!-- category labels: Inter 800, 35px, letter-spacing 2.1px -->
  <g id="labels" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="35" letter-spacing="2.1" fill="#FFFFFF" text-anchor="middle">
    <g id="row-1">
      <g id="label-healthcare">
        <rect x="598.1" y="322.7" width="332" height="74" rx="37" fill="#0F8E57" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="3"/>
        <text x="764.1" y="372.5">HEALTHCARE</text>
      </g>
      <g id="label-entrylevel">
        <rect x="949.1" y="322.7" width="339.1" height="74" rx="37" fill="#2563EB" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="3"/>
        <text x="1118.7" y="372.5">ENTRY-LEVEL</text>
      </g>
      <g id="label-veteran">
        <rect x="1307.2" y="322.7" width="254.7" height="74" rx="37" fill="#A02525" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="3"/>
        <text x="1434.5" y="372.5">VETERAN</text>
      </g>
    </g>
    <g id="row-2">
      <g id="label-diversity">
        <rect x="761" y="417.7" width="277.9" height="74" rx="37" fill="#E8731B" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="3"/>
        <text x="900" y="467.5">DIVERSITY</text>
      </g>
      <g id="label-technology">
        <rect x="1057.9" y="417.7" width="341" height="74" rx="37" fill="#5B3DAB" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="3"/>
        <text x="1228.4" y="467.5">TECHNOLOGY</text>
      </g>
    </g>
  </g>

  <!-- divider -->
  <rect id="divider" x="900" y="539.7" width="360" height="8" rx="4.0" fill="#FFB800"/>

  <!-- headline: Inter 900, 222px, letter-spacing -4.4px -->
  <text id="headline" x="1080.0" y="757.3" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="222" letter-spacing="-4.4" fill="#FFFFFF" text-anchor="middle">JOB FAIR</text>
</svg>
